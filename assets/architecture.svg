<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" role="img" aria-labelledby="t d"><title id="t">How it uses Vultr</title><desc id="d">A browser reaches the Coolify proxy over HTTPS, which serves the Next.js web app. The web app queues runs for the worker. Inside one Vultr VM run the proxy, web, worker and a migrate step. The VM uses Managed PostgreSQL, Object Storage and Serverless Inference.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="547" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><rect x="200" y="36" width="764" height="268" rx="16" fill="#EBF0EC" stroke="#8C9BB0" stroke-width="1.4" stroke-dasharray="7 6"/><text x="220" y="64" class="sans" font-size="13" font-weight="700" fill="#4B5B73" text-anchor="start" >Vultr VM running Coolify and docker-compose</text><rect x="36" y="88" width="128" height="108" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="52" y="118" class="serif" font-size="19" font-weight="700" fill="#14233B" text-anchor="start" >Browser</text><text x="52" y="142" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Owner, finance,</text><text x="52" y="160" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >accountant</text><rect x="220" y="88" width="136" height="108" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="236" y="118" class="serif" font-size="19" font-weight="700" fill="#14233B" text-anchor="start" >Proxy</text><text x="236" y="142" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Coolify, HTTPS</text><text x="236" y="160" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >on ports 80</text><text x="236" y="178" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >and 443</text><rect x="388" y="88" width="210" height="108" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="404" y="118" class="serif" font-size="19" font-weight="700" fill="#14233B" text-anchor="start" >web</text><text x="404" y="142" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Next.js app: inbox,</text><text x="404" y="160" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >approvals, review,</text><text x="404" y="178" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >dashboard, settings</text><rect x="672" y="88" width="272" height="108" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="688" y="118" class="serif" font-size="19" font-weight="700" fill="#14233B" text-anchor="start" >worker</text><text x="688" y="142" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Weekly cron and run queue</text><text x="688" y="160" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Mailbox check every 15 minutes</text><text x="688" y="178" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Nightly backup at 02:30 PKT</text><path d="M166,142 H216" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M358,142 H384" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M600,142 H668" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="634" y="132" class="sans" font-size="11.5" font-weight="400" fill="#4B5B73" text-anchor="middle" >queues runs</text><rect x="220" y="224" width="378" height="64" rx="10" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="236" y="252" class="sans" font-size="14" font-weight="700" fill="#14583F" text-anchor="start" >migrate</text><text x="236" y="272" class="sans" font-size="12.5" font-weight="400" fill="#14583F" text-anchor="start" >Runs before every deploy; web and worker wait for it.</text><rect x="672" y="224" width="272" height="64" rx="10" fill="#fff" stroke="#D3DDD4" stroke-width="1" /><text x="688" y="247" class="sans" font-size="14" font-weight="700" fill="#14233B" text-anchor="start" >Firewall group</text><text x="688" y="266" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="start" >80 and 443 open to all. SSH and Coolify</text><text x="688" y="280" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="start" >only from your IP.</text><path d="M181,304 V344" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M500,304 V344" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M819,304 V344" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="193" y="330" class="sans" font-size="11.5" font-weight="400" fill="#4B5B73" text-anchor="start" >private VPC host, TLS</text><text x="512" y="330" class="sans" font-size="11.5" font-weight="400" fill="#4B5B73" text-anchor="start" >S3 API</text><text x="831" y="330" class="sans" font-size="11.5" font-weight="400" fill="#4B5B73" text-anchor="start" >OpenAI-compatible API</text><rect x="36" y="352" width="290" height="124" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="52" y="382" class="serif" font-size="19" font-weight="700" fill="#14233B" text-anchor="start" >Managed PostgreSQL</text><text x="52" y="406" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >All records, the run queue and the</text><text x="52" y="424" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >cron schedules. Reached only from the</text><text x="52" y="442" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >VPC, over TLS. Backed up daily.</text><rect x="355" y="352" width="290" height="124" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="371" y="382" class="serif" font-size="19" font-weight="700" fill="#14233B" text-anchor="start" >Object Storage</text><text x="371" y="406" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Documents and the PDF of every sent</text><text x="371" y="424" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >invoice, keyed by SHA-256. A second</text><text x="371" y="442" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >bucket holds sealed nightly backups.</text><rect x="674" y="352" width="290" height="124" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="690" y="382" class="serif" font-size="19" font-weight="700" fill="#14233B" text-anchor="start" >Serverless Inference</text><text x="690" y="406" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >Classifies each document, extracts</text><text x="690" y="424" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >fields with a quote for every value,</text><text x="690" y="442" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >and reads client replies.</text><text x="36" y="508" class="sans" font-size="12.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Also on Vultr: the Vultr API, through a typed client behind pnpm infra:plan, apply and status and the live status on the settings page,</text><text x="36" y="526" class="sans" font-size="12.5" font-weight="400" fill="#4B5B73" text-anchor="start" >and an optional DNS record for app.&lt;domain&gt;.</text></svg>