<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="t d"><title id="t">How it runs on Vultr</title><desc id="d">A browser reaches the Coolify proxy over HTTPS at 45-76-150-156.sslip.io, which serves the Next.js web app. The web app queues runs for the worker. The proxy, web, worker and a migrate step run in one Vultr Cloud Compute VM in Singapore behind a firewall group. The VM uses Managed PostgreSQL 17, Object Storage and Serverless Inference, where minimax-m3.1-flash reads documents and emails.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999.0" height="589.0" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1"/><rect x="200.0" y="34.0" width="764.0" height="278.0" rx="16" fill="#E9EFEA" stroke="#9AA8BC" stroke-width="1.4" stroke-dasharray="6 5"/><text x="220.0" y="60.0" class="sans" font-size="13" font-weight="600" fill="#14233B">Vultr Cloud Compute: one VM (vc2-2c-4gb, Singapore) running Coolify and docker-compose</text><rect x="36.0" y="88.0" width="148.0" height="120.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="52.0" y="120.0" class="serif" font-size="20" font-weight="700" fill="#14233B">Browser</text><text x="52.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">Owners, finance,</text><text x="52.0" y="163.0" class="sans" font-size="13.5" fill="#4B5B73">accountants and</text><text x="52.0" y="182.0" class="sans" font-size="13.5" fill="#4B5B73">demo visitors</text><rect x="220.0" y="88.0" width="140.0" height="120.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="236.0" y="120.0" class="serif" font-size="20" font-weight="700" fill="#14233B">Proxy</text><text x="236.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">Coolify, HTTPS</text><text x="236.0" y="163.0" class="sans" font-size="13.5" fill="#4B5B73">(Let's Encrypt)</text><text x="236.0" y="182.0" class="sans" font-size="13.5" fill="#4B5B73">on 80 and 443</text><rect x="390.0" y="88.0" width="210.0" height="120.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="406.0" y="120.0" class="serif" font-size="20" font-weight="700" fill="#14233B">web</text><text x="406.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">Next.js app: inbox,</text><text x="406.0" y="163.0" class="sans" font-size="13.5" fill="#4B5B73">approvals, review,</text><text x="406.0" y="182.0" class="sans" font-size="13.5" fill="#4B5B73">dashboard, settings</text><rect x="672.0" y="88.0" width="272.0" height="120.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="688.0" y="120.0" class="serif" font-size="20" font-weight="700" fill="#14233B">worker</text><text x="688.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">pg-boss weekly cron and run queue</text><text x="688.0" y="163.0" class="sans" font-size="13.5" fill="#4B5B73">Mailbox check every 15 minutes</text><text x="688.0" y="182.0" class="sans" font-size="13.5" fill="#4B5B73">Nightly backup at 02:30 PKT</text><rect x="220.0" y="228.0" width="380.0" height="66.0" rx="12" fill="#DCEFE6"/><text x="236.0" y="254.0" class="sans" font-size="14" font-weight="700" fill="#14583F">migrate</text><text x="236.0" y="276.0" class="sans" font-size="13.5" fill="#4B5B73">Runs before every deploy; web and worker wait for it.</text><rect x="672.0" y="222.0" width="272.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="688.0" y="246.0" class="sans" font-size="14" font-weight="700" fill="#14233B">Firewall group</text><text x="688.0" y="266.0" class="sans" font-size="12.5" fill="#4B5B73">80 and 443 open to everyone.</text><text x="688.0" y="284.0" class="sans" font-size="12.5" fill="#4B5B73">SSH and Coolify only from the admin's IP.</text><path d="M184 148 H214" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><path d="M360 148 H384" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><path d="M600 148 H666" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><text x="636.0" y="138.0" class="sans" font-size="11" fill="#4B5B73" text-anchor="middle">queues runs</text><path d="M181 312 V362" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><text x="191.0" y="342.0" class="sans" font-size="11.5" fill="#4B5B73">private VPC host, TLS</text><rect x="36.0" y="368.0" width="290.0" height="130.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="52.0" y="400.0" class="serif" font-size="20" font-weight="700" fill="#14233B">Managed PostgreSQL 17</text><text x="52.0" y="424.0" class="sans" font-size="13.5" fill="#4B5B73">All records, the run queue and the cron</text><text x="52.0" y="443.0" class="sans" font-size="13.5" fill="#4B5B73">schedules. Reached only from the</text><text x="52.0" y="462.0" class="sans" font-size="13.5" fill="#4B5B73">VPC, over TLS. Backed up daily.</text><path d="M500 312 V362" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><text x="510.0" y="342.0" class="sans" font-size="11.5" fill="#4B5B73">S3 API</text><rect x="355.0" y="368.0" width="290.0" height="130.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="371.0" y="400.0" class="serif" font-size="20" font-weight="700" fill="#14233B">Object Storage</text><text x="371.0" y="424.0" class="sans" font-size="13.5" fill="#4B5B73">Documents and the PDF of every sent</text><text x="371.0" y="443.0" class="sans" font-size="13.5" fill="#4B5B73">invoice, keyed by SHA-256. A second</text><text x="371.0" y="462.0" class="sans" font-size="13.5" fill="#4B5B73">bucket holds sealed nightly backups.</text><path d="M819 312 V362" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><text x="829.0" y="342.0" class="sans" font-size="11.5" fill="#4B5B73">OpenAI-compatible API</text><rect x="674.0" y="368.0" width="290.0" height="130.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="690.0" y="400.0" class="serif" font-size="20" font-weight="700" fill="#14233B">Serverless Inference</text><text x="690.0" y="424.0" class="sans" font-size="13.5" fill="#4B5B73">minimax-m3.1-flash classifies each</text><text x="690.0" y="443.0" class="sans" font-size="13.5" fill="#4B5B73">document, extracts fields with a quote</text><text x="690.0" y="462.0" class="sans" font-size="13.5" fill="#4B5B73">for every value, and reads client</text><text x="690.0" y="481.0" class="sans" font-size="13.5" fill="#4B5B73">replies.</text><text x="36.0" y="532.0" class="sans" font-size="12.5" fill="#4B5B73">Also on Vultr: the Vultr API, through a typed client behind pnpm infra:plan, apply and status, and the live status on the settings page.</text><text x="36.0" y="554.0" class="sans" font-size="12.5" fill="#4B5B73">Live at https://45-76-150-156.sslip.io (no custom domain: the VM's address through sslip.io, with a real certificate).</text></svg>
