<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 618" width="1000" height="618" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">How it runs on Vultr</title>
<desc id="desc">A browser reaches the Coolify proxy over HTTPS at 45-76-150-156.sslip.io, which serves the Next.js web app; the web app queues runs for the worker. The proxy, web, worker and a migrate step run in one Vultr Cloud Compute VM (vc2-2c-4gb, Singapore) behind a firewall group. The VM uses three more Vultr services: Managed PostgreSQL 17 over a private VPC host with TLS, Object Storage through the S3 API, and Serverless Inference through its OpenAI-compatible API, where minimax-m3.1-flash reads documents and emails.</desc>
<style>
.serif{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400}
.sans{font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#5F6963" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F4A3C"/><stop offset="1" stop-color="#163A2F"/></linearGradient>
</defs>
<!-- Its own light card, so the drawing reads the same on GitHub's light and dark themes. -->
<rect x="0.5" y="0.5" width="999" height="617" rx="16" fill="#F7F8F5" stroke="#E7EAE5"/>
<!-- The VM -->
<rect x="200" y="30" width="768" height="290" rx="16" fill="#EDF3EE" stroke="#8DB09C" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="220" y="60" class="sans" font-size="13" fill="#5F6963"><tspan font-weight="700" fill="#214F41">Vultr Cloud Compute</tspan>: one VM (vc2-2c-4gb, Singapore) running Coolify and docker-compose</text>
<rect x="32" y="82" width="150" height="116" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="48" y="114" class="serif" font-size="20" fill="#29332F">Browser</text>
<text x="48" y="138" class="sans" font-size="13" fill="#5F6963">Owners, finance,</text>
<text x="48" y="157" class="sans" font-size="13" fill="#5F6963">accountants and</text>
<text x="48" y="176" class="sans" font-size="13" fill="#5F6963">demo visitors</text>
<rect x="220" y="82" width="150" height="116" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="236" y="114" class="serif" font-size="20" fill="#29332F">Proxy</text>
<text x="236" y="138" class="sans" font-size="13" fill="#5F6963">Coolify, HTTPS</text>
<text x="236" y="157" class="sans" font-size="13" fill="#5F6963">(Let’s Encrypt)</text>
<text x="236" y="176" class="sans" font-size="13" fill="#5F6963">on 80 and 443</text>
<rect x="392" y="82" width="196" height="116" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="408" y="114" class="serif" font-size="20" fill="#29332F">web</text>
<text x="408" y="138" class="sans" font-size="13" fill="#5F6963">Next.js app: inbox,</text>
<text x="408" y="157" class="sans" font-size="13" fill="#5F6963">approvals, review,</text>
<text x="408" y="176" class="sans" font-size="13" fill="#5F6963">dashboard, settings</text>
<rect x="664" y="82" width="284" height="116" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="680" y="114" class="serif" font-size="20" fill="#29332F">worker</text>
<text x="680" y="138" class="sans" font-size="13" fill="#5F6963">pg-boss weekly cron and run queue</text>
<text x="680" y="157" class="sans" font-size="13" fill="#5F6963">Mailbox check every 15 minutes</text>
<text x="680" y="176" class="sans" font-size="13" fill="#5F6963">Nightly backup at 02:30 PKT</text>
<path d="M184 140H213" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M372 140H385" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M592 140H657" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="626" y="131" class="sans" font-size="11" text-anchor="middle" fill="#5F6963">queues runs</text>
<rect x="220" y="214" width="380" height="86" rx="12" fill="#DCE9DF"/>
<text x="236" y="240" class="sans" font-size="14" font-weight="700" fill="#214F41">migrate</text>
<text x="236" y="262" class="sans" font-size="13" fill="#29332F">Runs before every deploy; web and worker wait for it.</text>
<rect x="664" y="214" width="284" height="86" rx="12" fill="#FFFFFF" stroke="#E7EAE5"/>
<g transform="translate(915 227) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 6v5.5c0 4.5-3 7.8-7 9.5-4-1.7-7-5-7-9.5V6z"/></g>
<text x="680" y="240" class="sans" font-size="14" font-weight="700" fill="#29332F">Firewall group</text>
<text x="680" y="262" class="sans" font-size="12.5" fill="#5F6963">80 and 443 open to everyone.</text>
<text x="680" y="280" class="sans" font-size="12.5" fill="#5F6963">SSH and Coolify only from the admin’s IP.</text>
<!-- Managed services -->
<path d="M180 322V368" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="190" y="351" class="sans" font-size="11.5" fill="#5F6963">private VPC host, TLS</text>
<rect x="32" y="374" width="296" height="136" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="48" y="400" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#214F41">VULTR</text>
<text x="48" y="426" class="serif" font-size="20" fill="#29332F">Managed PostgreSQL 17</text>
<text x="48" y="450" class="sans" font-size="13" fill="#5F6963">All records, the run queue and the</text>
<text x="48" y="469" class="sans" font-size="13" fill="#5F6963">cron schedules. Reached only from</text>
<text x="48" y="488" class="sans" font-size="13" fill="#5F6963">the VPC, over TLS. Backed up daily.</text>
<path d="M500 322V368" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="510" y="351" class="sans" font-size="11.5" fill="#5F6963">S3 API</text>
<rect x="352" y="374" width="296" height="136" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="368" y="400" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#214F41">VULTR</text>
<text x="368" y="426" class="serif" font-size="20" fill="#29332F">Object Storage</text>
<text x="368" y="450" class="sans" font-size="13" fill="#5F6963">Documents and the PDF of every sent</text>
<text x="368" y="469" class="sans" font-size="13" fill="#5F6963">invoice, keyed by SHA-256. A second</text>
<text x="368" y="488" class="sans" font-size="13" fill="#5F6963">bucket holds sealed nightly backups.</text>
<path d="M820 322V368" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="830" y="351" class="sans" font-size="11.5" fill="#5F6963">OpenAI-compatible API</text>
<rect x="672" y="374" width="296" height="136" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="688" y="400" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#214F41">VULTR</text>
<text x="688" y="426" class="serif" font-size="20" fill="#29332F">Serverless Inference</text>
<text x="688" y="450" class="sans" font-size="13" fill="#5F6963">minimax-m3.1-flash classifies each</text>
<text x="688" y="469" class="sans" font-size="13" fill="#5F6963">document, extracts fields with a quote</text>
<text x="688" y="488" class="sans" font-size="13" fill="#5F6963">for every value, and reads client replies.</text>
<!-- Footnotes -->
<rect x="32" y="530" width="936" height="60" rx="12" fill="#FFFFFF" stroke="#E7EAE5"/>
<rect x="32" y="544" width="2.5" height="32" fill="#C77959"/>
<text x="50" y="555" class="sans" font-size="12.5" fill="#5F6963"><tspan font-weight="700" fill="#29332F">Also on Vultr:</tspan> the Vultr API, through a typed client behind pnpm infra:plan, apply and status, and the live status on the settings page.</text>
<text x="50" y="575" class="sans" font-size="12.5" fill="#5F6963">Live at <tspan font-weight="700" fill="#214F41">https://45-76-150-156.sslip.io</tspan> (no custom domain: the VM’s address through sslip.io, with a real certificate).</text>
</svg>
