<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 536" width="1000" height="536" role="img" aria-labelledby="t d"><title id="t">The weekly run</title><desc id="d">Eight steps run every Monday at 09:00 Pakistan time: plan, pull, read, reconcile, flag, draft, send, follow up. Code decides most steps, a model reads documents, and a person approves what is sent.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="535" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><rect x="36" y="20" width="114" height="26" rx="13.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="93.0" y="37.55" class="sans" font-size="13" font-weight="600" fill="#14583F" text-anchor="middle" >Code decides</text><rect x="160" y="20" width="106" height="26" rx="13.0" fill="#E3E7FB" stroke="#E3E7FB" stroke-width="0" /><text x="213.0" y="37.55" class="sans" font-size="13" font-weight="600" fill="#2E3A9B" text-anchor="middle" >Model reads</text><rect x="276" y="20" width="137" height="26" rx="13.0" fill="#FAE9C9" stroke="#FAE9C9" stroke-width="0" /><text x="344.5" y="37.55" class="sans" font-size="13" font-weight="600" fill="#7A4E0B" text-anchor="middle" >Person approves</text><text x="964" y="38" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="end" >Every Monday at 09:00 Pakistan time, or when someone presses Run now</text><rect x="36" y="64" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="68" cy="100" r="15" fill="#1E7F5C"/><text x="68" y="106" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="94" y="107" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Plan</text><text x="54" y="150" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Looks at what is waiting:</text><text x="54" y="171" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >new mail, open invoices,</text><text x="54" y="192" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >flags and the policy.</text><rect x="54" y="216" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="79.0" y="232.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><path d="M253,100 H271" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="274" y="64" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="306" cy="100" r="15" fill="#1E7F5C"/><text x="306" y="106" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="332" y="107" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Pull</text><text x="292" y="150" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Brings in what arrived:</text><text x="292" y="171" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >bank advices, ePRCs, SMS,</text><text x="292" y="192" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >wallet exports, replies.</text><rect x="292" y="216" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="317.0" y="232.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><path d="M491,100 H509" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="512" y="64" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="544" cy="100" r="15" fill="#4457C8"/><text x="544" y="106" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="570" y="107" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Read</text><text x="530" y="150" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Classifies every document</text><text x="530" y="171" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >and email. Each value must</text><text x="530" y="192" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >quote its source text.</text><rect x="530" y="216" width="58" height="24" rx="12.0" fill="#E3E7FB" stroke="#E3E7FB" stroke-width="0" /><text x="559.0" y="232.375" class="sans" font-size="12.5" font-weight="600" fill="#2E3A9B" text-anchor="middle" >Model</text><rect x="596" y="216" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="621.0" y="232.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><path d="M729,100 H747" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="750" y="64" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="782" cy="100" r="15" fill="#1E7F5C"/><text x="782" y="106" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="808" y="107" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Reconcile</text><text x="768" y="150" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Links your own transfers,</text><text x="768" y="171" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >matches credits to</text><text x="768" y="192" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >invoices, explains fees.</text><rect x="768" y="216" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="793.0" y="232.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><rect x="36" y="308" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="68" cy="344" r="15" fill="#1E7F5C"/><text x="68" y="350" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="94" y="351" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Flag</text><text x="54" y="394" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Re-checks every rule and</text><text x="54" y="415" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >opens new flags, closes</text><text x="54" y="436" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >ones that have cleared.</text><rect x="54" y="460" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="79.0" y="476.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><path d="M253,344 H271" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="274" y="308" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="306" cy="344" r="15" fill="#1E7F5C"/><text x="306" y="350" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >6</text><text x="332" y="351" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Draft</text><text x="292" y="394" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Writes invoices and emails</text><text x="292" y="415" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >from templates. Numbers</text><text x="292" y="436" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >are checked to records.</text><rect x="292" y="460" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="317.0" y="476.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><path d="M491,344 H509" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="512" y="308" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="544" cy="344" r="15" fill="#9A6212"/><text x="544" y="350" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >7</text><text x="570" y="351" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Send</text><text x="530" y="394" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Sends what a person</text><text x="530" y="415" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >approved, or what the</text><text x="530" y="436" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >policy allows on its own.</text><rect x="530" y="460" width="65" height="24" rx="12.0" fill="#FAE9C9" stroke="#FAE9C9" stroke-width="0" /><text x="562.5" y="476.375" class="sans" font-size="12.5" font-weight="600" fill="#7A4E0B" text-anchor="middle" >Person</text><rect x="603" y="460" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="628.0" y="476.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><path d="M729,344 H747" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="750" y="308" width="214" height="196" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="782" cy="344" r="15" fill="#1E7F5C"/><text x="782" y="350" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >8</text><text x="808" y="351" class="serif" font-size="22" font-weight="700" fill="#14233B" text-anchor="start" >Follow up</text><text x="768" y="394" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Closes claims and promises</text><text x="768" y="415" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >once money settles. Lists</text><text x="768" y="436" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >what needs a person.</text><rect x="768" y="460" width="50" height="24" rx="12.0" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="0" /><text x="793.0" y="476.375" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle" >Code</text><rect x="826" y="460" width="65" height="24" rx="12.0" fill="#FAE9C9" stroke="#FAE9C9" stroke-width="0" /><text x="858.5" y="476.375" class="sans" font-size="12.5" font-weight="600" fill="#7A4E0B" text-anchor="middle" >Person</text><path d="M857,260 V282 H143 V304" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></svg>