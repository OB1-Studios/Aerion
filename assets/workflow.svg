<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 674" width="1000" height="674" role="img" aria-labelledby="t d"><title id="t">The weekly run</title><desc id="d">Eight steps run every Monday at 09:00 Pakistan time, or when someone presses Run now: plan, pull, read, reconcile, flag, draft, send, follow up. Code decides most steps, a model reads documents, and a person approves what is sent. Each step also shows what it did in the demo's first Monday run: 9 documents and 9 emails read, 7 payments matched, 9 flags opened (4 high), 6 emails drafted for approval; a week later 4 flags close on their own.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999.0" height="673.0" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1"/><rect x="36.0" y="20.0" width="118.7" height="26.0" rx="13" fill="#DCEFE6"/><text x="95.3" y="37.6" class="sans" font-size="13" font-weight="600" fill="#14583F" text-anchor="middle">Code decides</text><rect x="164.7" y="20.0" width="109.4" height="26.0" rx="13" fill="#E3E7FB"/><text x="219.4" y="37.6" class="sans" font-size="13" font-weight="600" fill="#2E3A9B" text-anchor="middle">Model reads</text><rect x="284.1" y="20.0" width="140.6" height="26.0" rx="13" fill="#FAE9C9"/><text x="354.4" y="37.6" class="sans" font-size="13" font-weight="600" fill="#7A4E0B" text-anchor="middle">Person approves</text><text x="964.0" y="37.5" class="sans" font-size="13" fill="#4B5B73" text-anchor="end">Every Monday at 09:00 Pakistan time, or when someone presses Run now</text><rect x="36.0" y="64.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="66.0" cy="100.0" r="14" fill="#1E7F5C"/><text x="66.0" y="105.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="90.0" y="108.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Plan</text><text x="54.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">Looks at what is waiting:</text><text x="54.0" y="165.0" class="sans" font-size="13.5" fill="#4B5B73">new mail, open invoices,</text><text x="54.0" y="186.0" class="sans" font-size="13.5" fill="#4B5B73">flags and the policy.</text><rect x="54.0" y="226.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="82.4" y="242.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><line x1="54.0" y1="264.5" x2="232.0" y2="264.5" stroke="#E3EAE4" stroke-width="1"/><text x="54.0" y="284.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="54.0" y="304.0" class="sans" font-size="13" font-weight="600" fill="#14233B">10 new items in the</text><text x="54.0" y="322.0" class="sans" font-size="13" font-weight="600" fill="#14233B">mailbox, 9 open invoices</text><path d="M256 100 H268" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><rect x="274.0" y="64.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="304.0" cy="100.0" r="14" fill="#1E7F5C"/><text x="304.0" y="105.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="328.0" y="108.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Pull</text><text x="292.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">Brings in what arrived:</text><text x="292.0" y="165.0" class="sans" font-size="13.5" fill="#4B5B73">bank advices, ePRCs,</text><text x="292.0" y="186.0" class="sans" font-size="13.5" fill="#4B5B73">SMS, wallet exports,</text><text x="292.0" y="207.0" class="sans" font-size="13.5" fill="#4B5B73">replies.</text><rect x="292.0" y="226.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="320.4" y="242.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><line x1="292.0" y1="264.5" x2="470.0" y2="264.5" stroke="#E3EAE4" stroke-width="1"/><text x="292.0" y="284.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="292.0" y="304.0" class="sans" font-size="13" font-weight="600" fill="#14233B">9 emails and a Payoneer</text><text x="292.0" y="322.0" class="sans" font-size="13" font-weight="600" fill="#14233B">export pulled in</text><path d="M494 100 H506" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><rect x="512.0" y="64.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="542.0" cy="100.0" r="14" fill="#3F4BB8"/><text x="542.0" y="105.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="566.0" y="108.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Read</text><text x="530.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">Classifies every document</text><text x="530.0" y="165.0" class="sans" font-size="13.5" fill="#4B5B73">and email. Each value</text><text x="530.0" y="186.0" class="sans" font-size="13.5" fill="#4B5B73">must quote its source text.</text><rect x="530.0" y="226.0" width="61.7" height="24.0" rx="12" fill="#E3E7FB"/><text x="560.8" y="242.5" class="sans" font-size="12.5" font-weight="600" fill="#2E3A9B" text-anchor="middle">Model</text><rect x="599.7" y="226.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="628.1" y="242.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><line x1="530.0" y1="264.5" x2="708.0" y2="264.5" stroke="#E3EAE4" stroke-width="1"/><text x="530.0" y="284.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="530.0" y="304.0" class="sans" font-size="13" font-weight="600" fill="#14233B">9 documents and 9 emails</text><text x="530.0" y="322.0" class="sans" font-size="13" font-weight="600" fill="#14233B">read in 17.8 s</text><path d="M732 100 H744" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><rect x="750.0" y="64.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="780.0" cy="100.0" r="14" fill="#1E7F5C"/><text x="780.0" y="105.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="804.0" y="108.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Reconcile</text><text x="768.0" y="144.0" class="sans" font-size="13.5" fill="#4B5B73">Links your own transfers,</text><text x="768.0" y="165.0" class="sans" font-size="13.5" fill="#4B5B73">matches credits to</text><text x="768.0" y="186.0" class="sans" font-size="13.5" fill="#4B5B73">invoices, explains fees.</text><rect x="768.0" y="226.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="796.4" y="242.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><line x1="768.0" y1="264.5" x2="946.0" y2="264.5" stroke="#E3EAE4" stroke-width="1"/><text x="768.0" y="284.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="768.0" y="304.0" class="sans" font-size="13" font-weight="600" fill="#14233B">7 payments matched, 2</text><text x="768.0" y="322.0" class="sans" font-size="13" font-weight="600" fill="#14233B">own transfers linked</text><rect x="36.0" y="378.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="66.0" cy="414.0" r="14" fill="#1E7F5C"/><text x="66.0" y="419.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="90.0" y="422.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Flag</text><text x="54.0" y="458.0" class="sans" font-size="13.5" fill="#4B5B73">Re-checks every rule and</text><text x="54.0" y="479.0" class="sans" font-size="13.5" fill="#4B5B73">opens new flags, closes</text><text x="54.0" y="500.0" class="sans" font-size="13.5" fill="#4B5B73">ones that have cleared.</text><rect x="54.0" y="540.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="82.4" y="556.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><line x1="54.0" y1="578.5" x2="232.0" y2="578.5" stroke="#E3EAE4" stroke-width="1"/><text x="54.0" y="598.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="54.0" y="618.0" class="sans" font-size="13" font-weight="600" fill="#14233B">9 flags opened, 4 of them</text><text x="54.0" y="636.0" class="sans" font-size="13" font-weight="600" fill="#14233B">high</text><path d="M256 414 H268" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><rect x="274.0" y="378.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="304.0" cy="414.0" r="14" fill="#1E7F5C"/><text x="304.0" y="419.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="328.0" y="422.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Draft</text><text x="292.0" y="458.0" class="sans" font-size="13.5" fill="#4B5B73">Writes invoices and emails</text><text x="292.0" y="479.0" class="sans" font-size="13.5" fill="#4B5B73">from templates. Numbers</text><text x="292.0" y="500.0" class="sans" font-size="13.5" fill="#4B5B73">are checked to records.</text><rect x="292.0" y="540.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="320.4" y="556.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><line x1="292.0" y1="578.5" x2="470.0" y2="578.5" stroke="#E3EAE4" stroke-width="1"/><text x="292.0" y="598.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="292.0" y="618.0" class="sans" font-size="13" font-weight="600" fill="#14233B">6 emails and 3 tasks,</text><text x="292.0" y="636.0" class="sans" font-size="13" font-weight="600" fill="#14233B">every number checked</text><path d="M494 414 H506" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><rect x="512.0" y="378.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="542.0" cy="414.0" r="14" fill="#9A6212"/><text x="542.0" y="419.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="566.0" y="422.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Send</text><text x="530.0" y="458.0" class="sans" font-size="13.5" fill="#4B5B73">Sends what a person</text><text x="530.0" y="479.0" class="sans" font-size="13.5" fill="#4B5B73">approved, or what the</text><text x="530.0" y="500.0" class="sans" font-size="13.5" fill="#4B5B73">policy allows on its own.</text><rect x="530.0" y="540.0" width="68.2" height="24.0" rx="12" fill="#FAE9C9"/><text x="564.1" y="556.5" class="sans" font-size="12.5" font-weight="600" fill="#7A4E0B" text-anchor="middle">Person</text><rect x="606.2" y="540.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="634.6" y="556.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><line x1="530.0" y1="578.5" x2="708.0" y2="578.5" stroke="#E3EAE4" stroke-width="1"/><text x="530.0" y="598.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="530.0" y="618.0" class="sans" font-size="13" font-weight="600" fill="#14233B">6 emails wait for a person</text><text x="530.0" y="636.0" class="sans" font-size="13" font-weight="600" fill="#14233B">to approve</text><path d="M732 414 H744" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/><rect x="750.0" y="378.0" width="214.0" height="276.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><circle cx="780.0" cy="414.0" r="14" fill="#1E7F5C"/><text x="780.0" y="419.0" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="804.0" y="422.0" class="serif" font-size="22" font-weight="700" fill="#14233B">Follow up</text><text x="768.0" y="458.0" class="sans" font-size="13.5" fill="#4B5B73">Closes claims and</text><text x="768.0" y="479.0" class="sans" font-size="13.5" fill="#4B5B73">promises once money</text><text x="768.0" y="500.0" class="sans" font-size="13.5" fill="#4B5B73">settles. Lists what needs a</text><text x="768.0" y="521.0" class="sans" font-size="13.5" fill="#4B5B73">person.</text><rect x="768.0" y="540.0" width="56.8" height="24.0" rx="12" fill="#DCEFE6"/><text x="796.4" y="556.5" class="sans" font-size="12.5" font-weight="600" fill="#14583F" text-anchor="middle">Code</text><rect x="832.8" y="540.0" width="68.2" height="24.0" rx="12" fill="#FAE9C9"/><text x="866.9" y="556.5" class="sans" font-size="12.5" font-weight="600" fill="#7A4E0B" text-anchor="middle">Person</text><line x1="768.0" y1="578.5" x2="946.0" y2="578.5" stroke="#E3EAE4" stroke-width="1"/><text x="768.0" y="598.0" class="sans" font-size="10" font-weight="700" fill="#6B7A90" letter-spacing="0.8">IN THE DEMO</text><text x="768.0" y="618.0" class="sans" font-size="13" font-weight="600" fill="#14233B">A week later, 4 flags close</text><text x="768.0" y="636.0" class="sans" font-size="13" font-weight="600" fill="#14233B">on their own</text><path d="M857.0 340 V356 H143.0 V372" fill="none" stroke="#5B6B84" stroke-width="1.6" marker-end="url(#ah)"/></svg>
