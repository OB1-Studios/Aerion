<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 674" width="1000" height="674" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">The weekly run</title>
<desc id="desc">Eight steps run every Monday at 09:00 Pakistan time, or when someone presses Run now: plan, pull, read, reconcile, flag, draft, send, follow up. Code decides most steps, a model reads documents, and a person approves what is sent. Each step also shows what it did in the demo's first Monday run: 10 new items in the mailbox and 9 open invoices; 9 emails and a Payoneer export pulled in; 9 documents and 9 emails read in 17.8 s; 7 payments matched and 2 own transfers linked; 9 flags opened, 4 of them high; 6 emails and 3 tasks drafted with every number checked; 6 emails wait for a person to approve; a week later 4 flags close on their own.</desc>
<style>
.serif{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400}
.sans{font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#5F6963" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F4A3C"/><stop offset="1" stop-color="#163A2F"/></linearGradient>
</defs>
<!-- Its own light card, so the drawing reads the same on GitHub's light and dark themes. -->
<rect x="0.5" y="0.5" width="999" height="673" rx="16" fill="#F7F8F5" stroke="#E7EAE5"/>
<rect x="32" y="20" width="106.5" height="26" rx="13" fill="#DCE9DF"/>
<text x="85.2" y="37.5" class="sans" font-size="12.5" font-weight="700" text-anchor="middle" fill="#214F41">Code decides</text>
<rect x="146.5" y="20" width="100.4" height="26" rx="13" fill="#E7EFF8"/>
<text x="196.7" y="37.5" class="sans" font-size="12.5" font-weight="700" text-anchor="middle" fill="#356A9A">Model reads</text>
<rect x="254.9" y="20" width="127.3" height="26" rx="13" fill="#FBF0DE"/>
<text x="318.5" y="37.5" class="sans" font-size="12.5" font-weight="700" text-anchor="middle" fill="#A86412">Person approves</text>
<text x="968" y="38" class="sans" font-size="13" text-anchor="end" fill="#5F6963">Every Monday at 09:00 Pakistan time, or when someone presses Run now</text>
<!-- 1. Plan -->
<rect x="32" y="64" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="64" cy="102" r="14" fill="#214F41"/>
<text x="64" y="107" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="88" y="110" class="serif" font-size="22" fill="#29332F">Plan</text>
<text x="50" y="146" class="sans" font-size="13" fill="#5F6963">Looks at what is waiting:</text>
<text x="50" y="165.5" class="sans" font-size="13" fill="#5F6963">new mail, open invoices,</text>
<text x="50" y="185" class="sans" font-size="13" fill="#5F6963">flags and the policy.</text>
<rect x="50" y="224" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="75.5" y="240.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="50" y1="264" x2="233" y2="264" stroke="#E7EAE5"/>
<text x="50" y="286" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="50" y="308" class="sans" font-size="13" font-weight="600" fill="#29332F">10 new items in the</text>
<text x="50" y="326" class="sans" font-size="13" font-weight="600" fill="#29332F">mailbox, 9 open invoices</text>
<path d="M255 102H266" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<!-- 2. Pull -->
<rect x="271" y="64" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="303" cy="102" r="14" fill="#214F41"/>
<text x="303" y="107" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="327" y="110" class="serif" font-size="22" fill="#29332F">Pull</text>
<text x="289" y="146" class="sans" font-size="13" fill="#5F6963">Brings in what arrived:</text>
<text x="289" y="165.5" class="sans" font-size="13" fill="#5F6963">bank advices, ePRCs, SMS,</text>
<text x="289" y="185" class="sans" font-size="13" fill="#5F6963">wallet exports, replies.</text>
<rect x="289" y="224" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="314.5" y="240.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="289" y1="264" x2="472" y2="264" stroke="#E7EAE5"/>
<text x="289" y="286" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="289" y="308" class="sans" font-size="13" font-weight="600" fill="#29332F">9 emails and a Payoneer</text>
<text x="289" y="326" class="sans" font-size="13" font-weight="600" fill="#29332F">export pulled in</text>
<path d="M494 102H505" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<!-- 3. Read -->
<rect x="510" y="64" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="542" cy="102" r="14" fill="#356A9A"/>
<text x="542" y="107" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="566" y="110" class="serif" font-size="22" fill="#29332F">Read</text>
<text x="528" y="146" class="sans" font-size="13" fill="#5F6963">Classifies every document</text>
<text x="528" y="165.5" class="sans" font-size="13" fill="#5F6963">and email. Each value</text>
<text x="528" y="185" class="sans" font-size="13" fill="#5F6963">must quote its source text.</text>
<rect x="528" y="224" width="57.1" height="24" rx="12" fill="#E7EFF8"/>
<text x="556.6" y="240.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#356A9A">Model</text>
<rect x="593.1" y="224" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="618.6" y="240.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="528" y1="264" x2="711" y2="264" stroke="#E7EAE5"/>
<text x="528" y="286" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="528" y="308" class="sans" font-size="13" font-weight="600" fill="#29332F">9 documents and 9</text>
<text x="528" y="326" class="sans" font-size="13" font-weight="600" fill="#29332F">emails read in 17.8 s</text>
<path d="M733 102H744" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<!-- 4. Reconcile -->
<rect x="749" y="64" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="781" cy="102" r="14" fill="#214F41"/>
<text x="781" y="107" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="805" y="110" class="serif" font-size="22" fill="#29332F">Reconcile</text>
<text x="767" y="146" class="sans" font-size="13" fill="#5F6963">Links your own transfers,</text>
<text x="767" y="165.5" class="sans" font-size="13" fill="#5F6963">matches credits to</text>
<text x="767" y="185" class="sans" font-size="13" fill="#5F6963">invoices, explains fees.</text>
<rect x="767" y="224" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="792.5" y="240.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="767" y1="264" x2="950" y2="264" stroke="#E7EAE5"/>
<text x="767" y="286" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="767" y="308" class="sans" font-size="13" font-weight="600" fill="#29332F">7 payments matched,</text>
<text x="767" y="326" class="sans" font-size="13" font-weight="600" fill="#29332F">2 own transfers linked</text>
<!-- 5. Flag -->
<rect x="32" y="378" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="64" cy="416" r="14" fill="#214F41"/>
<text x="64" y="421" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="88" y="424" class="serif" font-size="22" fill="#29332F">Flag</text>
<text x="50" y="460" class="sans" font-size="13" fill="#5F6963">Re-checks every rule and</text>
<text x="50" y="479.5" class="sans" font-size="13" fill="#5F6963">opens new flags, closes</text>
<text x="50" y="499" class="sans" font-size="13" fill="#5F6963">ones that have cleared.</text>
<rect x="50" y="538" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="75.5" y="554.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="50" y1="578" x2="233" y2="578" stroke="#E7EAE5"/>
<text x="50" y="600" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="50" y="622" class="sans" font-size="13" font-weight="600" fill="#29332F">9 flags opened,</text>
<text x="50" y="640" class="sans" font-size="13" font-weight="600" fill="#29332F">4 of them high</text>
<path d="M255 416H266" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<!-- 6. Draft -->
<rect x="271" y="378" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="303" cy="416" r="14" fill="#214F41"/>
<text x="303" y="421" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
<text x="327" y="424" class="serif" font-size="22" fill="#29332F">Draft</text>
<text x="289" y="460" class="sans" font-size="13" fill="#5F6963">Writes invoices and emails</text>
<text x="289" y="479.5" class="sans" font-size="13" fill="#5F6963">from templates. Numbers</text>
<text x="289" y="499" class="sans" font-size="13" fill="#5F6963">are checked to records.</text>
<rect x="289" y="538" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="314.5" y="554.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="289" y1="578" x2="472" y2="578" stroke="#E7EAE5"/>
<text x="289" y="600" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="289" y="622" class="sans" font-size="13" font-weight="600" fill="#29332F">6 emails and 3 tasks,</text>
<text x="289" y="640" class="sans" font-size="13" font-weight="600" fill="#29332F">every number checked</text>
<path d="M494 416H505" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<!-- 7. Send -->
<rect x="510" y="378" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="542" cy="416" r="14" fill="#C9A15F"/>
<text x="542" y="421" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#29332F">7</text>
<text x="566" y="424" class="serif" font-size="22" fill="#29332F">Send</text>
<text x="528" y="460" class="sans" font-size="13" fill="#5F6963">Sends what a person</text>
<text x="528" y="479.5" class="sans" font-size="13" fill="#5F6963">approved, or what the</text>
<text x="528" y="499" class="sans" font-size="13" fill="#5F6963">policy allows on its own.</text>
<rect x="528" y="538" width="61.3" height="24" rx="12" fill="#FBF0DE"/>
<text x="558.7" y="554.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#A86412">Person</text>
<rect x="597.3" y="538" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="622.8" y="554.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="528" y1="578" x2="711" y2="578" stroke="#E7EAE5"/>
<text x="528" y="600" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="528" y="622" class="sans" font-size="13" font-weight="600" fill="#29332F">6 emails wait for a</text>
<text x="528" y="640" class="sans" font-size="13" font-weight="600" fill="#29332F">person to approve</text>
<path d="M733 416H744" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<!-- 8. Follow up -->
<rect x="749" y="378" width="219" height="276" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="781" cy="416" r="14" fill="#214F41"/>
<text x="781" y="421" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">8</text>
<text x="805" y="424" class="serif" font-size="22" fill="#29332F">Follow up</text>
<text x="767" y="460" class="sans" font-size="13" fill="#5F6963">Closes claims and promises</text>
<text x="767" y="479.5" class="sans" font-size="13" fill="#5F6963">once money settles. Lists</text>
<text x="767" y="499" class="sans" font-size="13" fill="#5F6963">what needs a person.</text>
<rect x="767" y="538" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="792.5" y="554.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<rect x="825.9" y="538" width="61.3" height="24" rx="12" fill="#FBF0DE"/>
<text x="856.6" y="554.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#A86412">Person</text>
<line x1="767" y1="578" x2="950" y2="578" stroke="#E7EAE5"/>
<text x="767" y="600" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5F6963">IN THE DEMO</text>
<text x="767" y="622" class="sans" font-size="13" font-weight="600" fill="#29332F">A week later, 4 flags</text>
<text x="767" y="640" class="sans" font-size="13" font-weight="600" fill="#29332F">close on their own</text>
<!-- Row 1 continues into row 2 -->
<path d="M858.5 340V359H141.5V372" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
