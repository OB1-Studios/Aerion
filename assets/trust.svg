<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" width="1000" height="604" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">Why a business can let it run</title>
<desc id="desc">Seven safeguards, one per card: code decides and the model reads; numbers are checked twice; code decides whose document it is; a policy decides what goes out; a person checks what the agent can't; the workflow survives a model outage; everything is on the record. The eighth card, in dark green: it never moves money.</desc>
<style>
.serif{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400}
.sans{font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#5F6963" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F4A3C"/><stop offset="1" stop-color="#163A2F"/></linearGradient>
</defs>
<!-- Its own light card, so the drawing reads the same on GitHub's light and dark themes. -->
<rect x="0.5" y="0.5" width="999" height="603" rx="16" fill="#F7F8F5" stroke="#E7EAE5"/>
<!-- Code decides, the model reads -->
<rect x="32" y="28" width="458" height="125" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="76" cy="70.0" r="22" fill="#DCE9DF"/>
<g transform="translate(64 58) scale(1)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,7 3,12 8,17"/><polyline points="16,7 21,12 16,17"/><line x1="13.5" y1="5" x2="10.5" y2="19"/></g>
<text x="116" y="66" class="serif" font-size="19" fill="#29332F">Code decides, the model reads</text>
<text x="116" y="90" class="sans" font-size="13.5" fill="#5F6963">Amounts, dates, currencies and IBANs</text>
<text x="116" y="109.5" class="sans" font-size="13.5" fill="#5F6963">are validated after extraction. A value that</text>
<text x="116" y="129" class="sans" font-size="13.5" fill="#5F6963">doesn’t quote its source goes to review.</text>
<!-- Numbers are checked twice -->
<rect x="510" y="28" width="458" height="125" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="554" cy="70.0" r="22" fill="#DCE9DF"/>
<g transform="translate(542 58) scale(1)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,13 6.5,17 13,8"/><polyline points="11,16 14,19 21.5,8"/></g>
<text x="594" y="66" class="serif" font-size="19" fill="#29332F">Numbers are checked twice</text>
<text x="594" y="90" class="sans" font-size="13.5" fill="#5F6963">Every amount, date and invoice number in an</text>
<text x="594" y="109.5" class="sans" font-size="13.5" fill="#5F6963">email must match the records, at draft time and</text>
<text x="594" y="129" class="sans" font-size="13.5" fill="#5F6963">again at send time. A draft that fails is blocked.</text>
<!-- Code decides whose document it is -->
<rect x="32" y="169" width="458" height="125" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="76" cy="211.0" r="22" fill="#DCE9DF"/>
<g transform="translate(64 199) scale(1)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="116" y="207" class="serif" font-size="19" fill="#29332F">Code decides whose document it is</text>
<text x="116" y="231" class="sans" font-size="13.5" fill="#5F6963">A document counts for a workspace only if</text>
<text x="116" y="250.5" class="sans" font-size="13.5" fill="#5F6963">its IBAN or legal name matches. The</text>
<text x="116" y="270" class="sans" font-size="13.5" fill="#5F6963">model can lower that match, never raise it.</text>
<!-- A policy decides what goes out -->
<rect x="510" y="169" width="458" height="125" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="554" cy="211.0" r="22" fill="#DCE9DF"/>
<g transform="translate(542 199) scale(1)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="16" cy="12" r="2.6"/></g>
<text x="594" y="207" class="serif" font-size="19" fill="#29332F">A policy decides what goes out</text>
<text x="594" y="231" class="sans" font-size="13.5" fill="#5F6963">Supervised by default: a person approves</text>
<text x="594" y="250.5" class="sans" font-size="13.5" fill="#5F6963">every email. Autopilot sends routine ones</text>
<text x="594" y="270" class="sans" font-size="13.5" fill="#5F6963">itself and holds sensitive ones for 30 minutes.</text>
<!-- A person checks what it can't -->
<rect x="32" y="310" width="458" height="125" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="76" cy="352.0" r="22" fill="#FBF0DE"/>
<g transform="translate(64 340) scale(1)" fill="none" stroke="#A86412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></g>
<text x="116" y="348" class="serif" font-size="19" fill="#29332F">A person checks what it can’t</text>
<text x="116" y="372" class="sans" font-size="13.5" fill="#5F6963">A document that fails a check goes to</text>
<text x="116" y="391.5" class="sans" font-size="13.5" fill="#5F6963">the review queue. A person corrects and</text>
<text x="116" y="411" class="sans" font-size="13.5" fill="#5F6963">confirms, or sets it aside with a reason.</text>
<!-- It survives a model outage -->
<rect x="510" y="310" width="458" height="125" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="554" cy="352.0" r="22" fill="#E7EFF8"/>
<g transform="translate(542 340) scale(1)" fill="none" stroke="#356A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13,2 5,13.5 11,13.5 10,22 19,10 13,10"/></g>
<text x="594" y="348" class="serif" font-size="19" fill="#29332F">It survives a model outage</text>
<text x="594" y="372" class="sans" font-size="13.5" fill="#5F6963">If inference is down or unusable, built-in</text>
<text x="594" y="391.5" class="sans" font-size="13.5" fill="#5F6963">layout rules read the documents, the run still</text>
<text x="594" y="411" class="sans" font-size="13.5" fill="#5F6963">completes, and the failed calls are recorded.</text>
<!-- Everything is on the record -->
<rect x="32" y="451" width="458" height="125" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<circle cx="76" cy="493.0" r="22" fill="#F2F4F0"/>
<g transform="translate(64 481) scale(1)" fill="none" stroke="#29332F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></g>
<text x="116" y="489" class="serif" font-size="19" fill="#29332F">Everything is on the record</text>
<text x="116" y="513" class="sans" font-size="13.5" fill="#5F6963">Every action by people and the agent is in</text>
<text x="116" y="532.5" class="sans" font-size="13.5" fill="#5F6963">the audit log. Each model call is stored with</text>
<text x="116" y="552" class="sans" font-size="13.5" fill="#5F6963">its model, prompt version, tokens and cost.</text>
<!-- It never moves money -->
<rect x="510" y="451" width="458" height="125" rx="14" fill="url(#panel)"/>
<circle cx="554" cy="493.0" r="22" fill="#163A2F" stroke="#336352"/>
<g transform="translate(542 481) scale(1)" fill="none" stroke="#DC957A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><line x1="6" y1="18" x2="18" y2="6"/></g>
<text x="594" y="489" class="serif" font-size="19" fill="#EEF4F0">It never moves money</text>
<text x="594" y="513" class="sans" font-size="13.5" fill="#A9C2B6">It reads documents, matches payments, flags problems</text>
<text x="594" y="532.5" class="sans" font-size="13.5" fill="#A9C2B6">and drafts emails. The money itself is never touched.</text>
</svg>
