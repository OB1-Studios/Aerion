<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 586" width="1000" height="586" role="img" aria-labelledby="t d"><title id="t">Why a business can let it run</title><desc id="d">Seven safeguards: code decides and the model reads; numbers are checked twice; code decides whose document it is; a policy decides what goes out; a person checks what the agent can't; the workflow survives a model outage; everything is on the record. It never moves money.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="585" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><rect x="36" y="28" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="80" cy="70" r="24" fill="#DCEFE6"/><g transform="translate(68,58) scale(1.0)" fill="none" stroke="#1E7F5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,7 3,12 8,17"/><polyline points="16,7 21,12 16,17"/><line x1="13.5" y1="5" x2="10.5" y2="19"/></g><text x="120" y="64" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >Code decides, the model reads</text><text x="120" y="90" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Amounts, dates, currencies and IBANs are validated</text><text x="120" y="110" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >after extraction. A value that doesn't quote its</text><text x="120" y="130" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >source goes to review.</text><rect x="512" y="28" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="556" cy="70" r="24" fill="#DCEFE6"/><g transform="translate(544,58) scale(1.0)" fill="none" stroke="#1E7F5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,13 6.5,17 13,8"/><polyline points="11,16 14,19 21.5,8"/></g><text x="596" y="64" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >Numbers are checked twice</text><text x="596" y="90" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Every amount, date and invoice number in an email</text><text x="596" y="110" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >must match the records, at draft time and again at</text><text x="596" y="130" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >send time. A draft that fails is blocked.</text><rect x="36" y="166" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="80" cy="208" r="24" fill="#DCEFE6"/><g transform="translate(68,196) scale(1.0)" fill="none" stroke="#1E7F5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g><text x="120" y="202" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >Code decides whose document it is</text><text x="120" y="228" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >A document counts for a workspace only if its IBAN</text><text x="120" y="248" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >or legal name matches. The model can lower that</text><text x="120" y="268" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >match, never raise it.</text><rect x="512" y="166" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="556" cy="208" r="24" fill="#DCEFE6"/><g transform="translate(544,196) scale(1.0)" fill="none" stroke="#1E7F5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="16" cy="12" r="2.6"/></g><text x="596" y="202" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >A policy decides what goes out</text><text x="596" y="228" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Supervised by default: a person approves every</text><text x="596" y="248" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >email. Autopilot sends routine ones itself and holds</text><text x="596" y="268" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >sensitive ones for 30 minutes.</text><rect x="36" y="304" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="80" cy="346" r="24" fill="#FAE9C9"/><g transform="translate(68,334) scale(1.0)" fill="none" stroke="#9A6212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></g><text x="120" y="340" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >A person checks what it can't</text><text x="120" y="366" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >A document that fails a check goes to the review</text><text x="120" y="386" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >queue. A person corrects and confirms, or sets it</text><text x="120" y="406" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >aside with a reason.</text><rect x="512" y="304" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="556" cy="346" r="24" fill="#E3E7FB"/><g transform="translate(544,334) scale(1.0)" fill="none" stroke="#4457C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13,2 5,13.5 11,13.5 10,22 19,10 13,10"/></g><text x="596" y="340" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >It survives a model outage</text><text x="596" y="366" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >If inference is down or unusable, built-in layout</text><text x="596" y="386" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >rules read the documents, the run still completes,</text><text x="596" y="406" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >and the failed calls are recorded.</text><rect x="36" y="442" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><circle cx="80" cy="484" r="24" fill="#E7ECF2"/><g transform="translate(68,472) scale(1.0)" fill="none" stroke="#14233B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></g><text x="120" y="478" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >Everything is on the record</text><text x="120" y="504" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Every action by people and the agent is in the audit</text><text x="120" y="524" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >log. Each model call is stored with its model, prompt</text><text x="120" y="544" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >version, tokens and cost.</text><rect x="512" y="442" width="452" height="124" rx="14" fill="#14233B" stroke="#14233B" stroke-width="0" /><circle cx="556" cy="484" r="24" fill="#2A1F2B"/><g transform="translate(544,472) scale(1.0)" fill="none" stroke="#DD4B3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><line x1="6" y1="18" x2="18" y2="6"/></g><text x="596" y="478" class="serif" font-size="18" font-weight="700" fill="#F3F6FA" text-anchor="start" >It never moves money</text><text x="596" y="504" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >It reads documents, matches payments, flags</text><text x="596" y="524" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >problems and drafts emails. The money itself</text><text x="596" y="544" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >is never touched.</text></svg>