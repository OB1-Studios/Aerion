<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 792" width="1000" height="792" role="img" aria-labelledby="t d"><title id="t">Flags, this Monday and next</title><desc id="d">The Flags page after the first Monday run: 9 open flags, 4 of them high. A last column shows the next Monday: 4 flags close on their own because the money arrived, the bank corrected the purpose code or sent the ePRC; 5 stay open.</desc><style>.sans{font-family:Arial,Helvetica,'Liberation Sans',ui-sans-serif,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><clipPath id="win"><rect x="0" y="0" width="1000" height="792" rx="14"/></clipPath></defs><g clip-path="url(#win)"><rect x="0.0" y="0.0" width="1000.0" height="792.0" rx="0" fill="#f6f7f9"/><rect x="0.0" y="0.0" width="1000.0" height="40.0" rx="0" fill="#eceff3"/><line x1="0.0" y1="40.5" x2="1000.0" y2="40.5" stroke="#d5dbe3" stroke-width="1"/><circle cx="22.0" cy="20.0" r="5.5" fill="#ec6a5e"/><circle cx="40.0" cy="20.0" r="5.5" fill="#f4bf4f"/><circle cx="58.0" cy="20.0" r="5.5" fill="#61c554"/><rect x="84.0" y="9.0" width="896.0" height="22.0" rx="11" fill="#ffffff" stroke="#d8dee6" stroke-width="1"/><path d="M98.2 19.6v-2.3a2.8 2.8 0 0 1 5.6 0v2.3" fill="none" stroke="#64748b" stroke-width="1.4"/><rect x="96.6" y="19.4" width="8.8" height="6.6" rx="1.5" fill="#64748b"/><text x="112.0" y="24.4" class="sans" font-size="12" fill="#475569">45-76-150-156.sslip.io/w/demo-…-office/flags</text><rect x="0.0" y="41.0" width="1000.0" height="36.0" rx="0" fill="#f5f3ff"/><line x1="0.0" y1="77.5" x2="1000.0" y2="77.5" stroke="#ddd6fe" stroke-width="1"/><rect x="16.0" y="50.0" width="44.9" height="18.0" rx="9" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/><text x="23.0" y="62.9" class="sans" font-size="11" font-weight="500" fill="#5b21b6">demo</text><text x="70.9" y="63.5" class="sans" font-size="13" fill="#2e1065">Simulated clock: <tspan font-weight="700">Mon, 2 Nov 2026, 09:00</tspan> PKT</text><rect x="923.3" y="46.0" width="60.7" height="26.0" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="953.7" y="63.4" class="sans" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Reset</text><rect x="790.7" y="46.0" width="124.6" height="26.0" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="853.0" y="63.4" class="sans" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Next Monday →</text><rect x="703.4" y="46.0" width="79.4" height="26.0" rx="7" fill="#0f766e"/><text x="743.0" y="63.4" class="sans" font-size="12.5" font-weight="500" fill="#ffffff" text-anchor="middle">Run now</text><text x="24.0" y="116.0" class="sans" font-size="22" font-weight="700" fill="#0f172a">Flags</text><text x="24.0" y="140.0" class="sans" font-size="13" fill="#64748b">Problems the rules found. Each run re-checks them: a flag closes on its own when the condition clears (a payment arrives, the bank sends the ePRC).</text><rect x="24.0" y="164.0" width="62.0" height="30.0" rx="8" fill="#e0eae8"/><text x="55.0" y="184.0" class="sans" font-size="13.5" font-weight="700" fill="#0f766e" text-anchor="middle">Open</text><text x="104.0" y="184.0" class="sans" font-size="13.5" fill="#475569">Resolved</text><text x="190.0" y="184.0" class="sans" font-size="13.5" fill="#475569">Dismissed</text><rect x="24.0" y="204.0" width="952.0" height="566.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="810.0" y="205.0" width="165.0" height="564.0" rx="0" fill="#f3faf8"/><line x1="810.0" y1="204.0" x2="810.0" y2="770.0" stroke="#cce5df" stroke-width="1"/><text x="40.0" y="228.0" class="sans" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="0.4">SEVERITY</text><text x="128.0" y="228.0" class="sans" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="0.4">WHAT</text><text x="728.0" y="228.0" class="sans" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="0.4">MON 2 NOV</text><text x="824.0" y="228.0" class="sans" font-size="10.5" font-weight="700" fill="#0f766e" letter-spacing="0.4">NEXT MONDAY, 9 NOV</text><line x1="24.0" y1="242.5" x2="976.0" y2="242.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="255.0" width="37.3" height="18.0" rx="9" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/><text x="47.0" y="267.9" class="sans" font-size="11" font-weight="500" fill="#9f1239">high</text><text x="128.0" y="268.0" class="sans" font-size="12.5" fill="#0f172a">Al Noor Trading FZ-LLC paid USD 6,750.00 against INV-2026-029 for USD 7,500.00; USD</text><text x="128.0" y="285.0" class="sans" font-size="12.5" fill="#0f172a">750.00 is unexplained (10.00%).</text><rect x="728.0" y="255.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="267.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="255.0" width="60.7" height="18.0" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="831.0" y="267.9" class="sans" font-size="11" font-weight="500" fill="#065f46">resolved</text><text x="824.0" y="288.0" class="sans" font-size="11" fill="#64748b">the rest was paid</text><line x1="24.0" y1="302.5" x2="976.0" y2="302.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="315.0" width="37.3" height="18.0" rx="9" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/><text x="47.0" y="327.9" class="sans" font-size="11" font-weight="500" fill="#9f1239">high</text><text x="128.0" y="328.0" class="sans" font-size="12.5" fill="#0f172a">Dr. Elena Varga's EUR 1,200.00 payment for INV-2026-031 arrived with purpose code 9471</text><text x="128.0" y="345.0" class="sans" font-size="12.5" fill="#0f172a">instead of 9186. No ePRC has been issued yet, so the bank can still correct it.</text><rect x="728.0" y="315.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="327.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="315.0" width="60.7" height="18.0" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="831.0" y="327.9" class="sans" font-size="11" font-weight="500" fill="#065f46">resolved</text><text x="824.0" y="348.0" class="sans" font-size="11" fill="#64748b">the bank corrected it</text><line x1="24.0" y1="362.5" x2="976.0" y2="362.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="375.0" width="37.3" height="18.0" rx="9" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/><text x="47.0" y="387.9" class="sans" font-size="11" font-weight="500" fill="#9f1239">high</text><text x="128.0" y="388.0" class="sans" font-size="12.5" fill="#0f172a">Brightlane Health LLC said INV-2026-032 was paid on 26 October 2026, but no matching credit</text><text x="128.0" y="405.0" class="sans" font-size="12.5" fill="#0f172a">has arrived after 5 business days (we wait 5 for swift).</text><rect x="728.0" y="375.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="387.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="375.0" width="60.7" height="18.0" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="831.0" y="387.9" class="sans" font-size="11" font-weight="500" fill="#065f46">resolved</text><text x="824.0" y="408.0" class="sans" font-size="11" fill="#64748b">the money arrived</text><line x1="24.0" y1="422.5" x2="976.0" y2="422.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="435.0" width="37.3" height="18.0" rx="9" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/><text x="47.0" y="447.9" class="sans" font-size="11" font-weight="500" fill="#9f1239">high</text><text x="128.0" y="448.0" class="sans" font-size="12.5" fill="#0f172a">A message from accounts@ravicodework.example uses a domain that imitates</text><text x="128.0" y="465.0" class="sans" font-size="12.5" fill="#0f172a">ravicodeworks.example. Possible invoice fraud: our bank details have not changed.</text><rect x="728.0" y="435.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="447.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="435.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="831.0" y="447.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><text x="824.0" y="468.0" class="sans" font-size="11" fill="#64748b">a person calls the client</text><line x1="24.0" y1="482.5" x2="976.0" y2="482.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="495.0" width="57.9" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="47.0" y="507.9" class="sans" font-size="11" font-weight="500" fill="#92400e">medium</text><text x="128.0" y="508.0" class="sans" font-size="12.5" fill="#0f172a">The ePRC for INV-2026-018 was issued with code 9471 instead of 9186. Ask the bank whether</text><text x="128.0" y="525.0" class="sans" font-size="12.5" fill="#0f172a">it can be reissued.</text><rect x="728.0" y="495.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="507.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="495.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="831.0" y="507.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><line x1="24.0" y1="542.5" x2="976.0" y2="542.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="555.0" width="57.9" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="47.0" y="567.9" class="sans" font-size="11" font-weight="500" fill="#92400e">medium</text><text x="128.0" y="568.0" class="sans" font-size="12.5" fill="#0f172a">INV-2026-024 (Thames Ledger Ltd) is 8 business days overdue; reminder 2 is due (reminder 1</text><text x="128.0" y="585.0" class="sans" font-size="12.5" fill="#0f172a">was sent).</text><rect x="728.0" y="555.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="567.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="555.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="831.0" y="567.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><line x1="24.0" y1="602.5" x2="976.0" y2="602.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="615.0" width="57.9" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="47.0" y="627.9" class="sans" font-size="11" font-weight="500" fill="#92400e">medium</text><text x="128.0" y="628.0" class="sans" font-size="12.5" fill="#0f172a">No ePRC on file for the USD 7,500.00 credit of 6 October 2026 (INV-2026-020), 27 days later.</text><rect x="728.0" y="615.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="627.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="615.0" width="60.7" height="18.0" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="831.0" y="627.9" class="sans" font-size="11" font-weight="500" fill="#065f46">resolved</text><text x="824.0" y="648.0" class="sans" font-size="11" fill="#64748b">the ePRC arrived</text><line x1="24.0" y1="662.5" x2="976.0" y2="662.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="675.0" width="57.9" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="47.0" y="687.9" class="sans" font-size="11" font-weight="500" fill="#92400e">medium</text><text x="128.0" y="688.0" class="sans" font-size="12.5" fill="#0f172a">No withholding tax certificate on file for the CAD 9,000.00 credit of 9 October 2026</text><text x="128.0" y="705.0" class="sans" font-size="12.5" fill="#0f172a">(INV-2026-021), 24 days later.</text><rect x="728.0" y="675.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="687.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="675.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="831.0" y="687.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><line x1="24.0" y1="722.5" x2="976.0" y2="722.5" stroke="#e2e8f0" stroke-width="1"/><rect x="40.0" y="735.0" width="57.9" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="47.0" y="747.9" class="sans" font-size="11" font-weight="500" fill="#92400e">medium</text><text x="128.0" y="748.0" class="sans" font-size="12.5" fill="#0f172a">PSEB registration expires on 15 December 2026, in 43 days. Start the renewal.</text><rect x="728.0" y="735.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="735.0" y="747.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text><rect x="824.0" y="735.0" width="41.5" height="18.0" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="831.0" y="747.9" class="sans" font-size="11" font-weight="500" fill="#92400e">open</text></g><rect x="0.5" y="0.5" width="999.0" height="791.0" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1"/></svg>
