<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" role="img" aria-labelledby="t d"><title id="t">The year-end tax pack</title><desc id="d">One zip for the accountant: export proceeds by month, every credit with its ePRC and withholding certificate status, the banking-channel share working, invoices issued, credit notes, write-offs and voids, open flags as exceptions, and a README with the year in numbers.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="451" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><rect x="36" y="36" width="270" height="380" rx="14" fill="#14233B" stroke="#14233B" stroke-width="0" /><g transform="translate(62,54) scale(1.6666666666666667)" fill="none" stroke="#F3C873" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="8"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="10" y1="11" x2="14" y2="11"/><rect x="10" y="13" width="4" height="4" rx="1"/></g><text x="62" y="130" class="serif" font-size="26" font-weight="700" fill="#F3F6FA" text-anchor="start" >Year-end</text><text x="62" y="162" class="serif" font-size="26" font-weight="700" fill="#F3F6FA" text-anchor="start" >tax pack</text><text x="62" y="192" class="sans" font-size="14" font-weight="400" fill="#C9D4E6" text-anchor="start" >One zip for the accountant.</text><line x1="62" y1="210" x2="280" y2="210" stroke="#38507A"/><text x="62" y="238" class="sans" font-size="13" font-weight="700" fill="#F3C873" text-anchor="start" >Before it builds</text><text x="62" y="258" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >The page lists what the</text><text x="62" y="277" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >accountant will ask about,</text><text x="62" y="296" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >each with a link to fix it.</text><text x="62" y="326" class="sans" font-size="13" font-weight="700" fill="#F3C873" text-anchor="start" >Who can use it</text><text x="62" y="346" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >Owners, finance and the</text><text x="62" y="365" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >accountant build it. Viewers</text><text x="62" y="384" class="sans" font-size="13.5" font-weight="400" fill="#C9D4E6" text-anchor="start" >can download it.</text><rect x="336" y="42" width="22" height="28" rx="3" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><line x1="341" y1="51" x2="353" y2="51" stroke="#5B6B84" stroke-width="1.3"/><line x1="341" y1="57" x2="353" y2="57" stroke="#5B6B84" stroke-width="1.3"/><text x="376" y="56" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Export proceeds by month</text><text x="376" y="76" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >In the currency received and in PKR</text><line x1="336" y1="88" x2="964" y2="88" stroke="#D3DDD4"/><rect x="336" y="96" width="22" height="28" rx="3" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><line x1="341" y1="105" x2="353" y2="105" stroke="#5B6B84" stroke-width="1.3"/><line x1="341" y1="111" x2="353" y2="111" stroke="#5B6B84" stroke-width="1.3"/><text x="376" y="110" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Every credit, with its paperwork status</text><text x="376" y="130" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >ePRC and withholding certificate status and number, plus copies on file</text><line x1="336" y1="142" x2="964" y2="142" stroke="#D3DDD4"/><rect x="336" y="150" width="22" height="28" rx="3" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><line x1="341" y1="159" x2="353" y2="159" stroke="#5B6B84" stroke-width="1.3"/><line x1="341" y1="165" x2="353" y2="165" stroke="#5B6B84" stroke-width="1.3"/><text x="376" y="164" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Banking-channel share working</text><text x="376" y="184" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >The working behind the share of income that came through banks</text><line x1="336" y1="196" x2="964" y2="196" stroke="#D3DDD4"/><rect x="336" y="204" width="22" height="28" rx="3" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><line x1="341" y1="213" x2="353" y2="213" stroke="#5B6B84" stroke-width="1.3"/><line x1="341" y1="219" x2="353" y2="219" stroke="#5B6B84" stroke-width="1.3"/><text x="376" y="218" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Invoices issued in the year</text><text x="376" y="238" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >With what came in and what was credited</text><line x1="336" y1="250" x2="964" y2="250" stroke="#D3DDD4"/><rect x="336" y="258" width="22" height="28" rx="3" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><line x1="341" y1="267" x2="353" y2="267" stroke="#5B6B84" stroke-width="1.3"/><line x1="341" y1="273" x2="353" y2="273" stroke="#5B6B84" stroke-width="1.3"/><text x="376" y="272" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Credit notes, write-offs and voids</text><text x="376" y="292" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >With their reasons</text><line x1="336" y1="304" x2="964" y2="304" stroke="#D3DDD4"/><rect x="336" y="312" width="22" height="28" rx="3" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><line x1="341" y1="321" x2="353" y2="321" stroke="#5B6B84" stroke-width="1.3"/><line x1="341" y1="327" x2="353" y2="327" stroke="#5B6B84" stroke-width="1.3"/><text x="376" y="326" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Flags still open</text><text x="376" y="346" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Listed as exceptions</text><line x1="336" y1="358" x2="964" y2="358" stroke="#D3DDD4"/><rect x="336" y="366" width="22" height="28" rx="3" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><line x1="341" y1="375" x2="353" y2="375" stroke="#5B6B84" stroke-width="1.3"/><line x1="341" y1="381" x2="353" y2="381" stroke="#5B6B84" stroke-width="1.3"/><text x="376" y="380" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >A README for the accountant</text><text x="376" y="400" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >The year in numbers, PSEB status (does it lapse this year?), what's missing</text></svg>