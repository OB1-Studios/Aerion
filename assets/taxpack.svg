<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">The year-end tax pack</title>
<desc id="desc">One zip for the accountant: export proceeds by month in the currency received and in PKR; every credit with its ePRC and withholding certificate status; the banking-channel share working; invoices issued in the year; credit notes, write-offs and voids with their reasons; flags still open, listed as exceptions; and a README with the year in numbers. Before it builds, the page lists what the accountant will ask about. Owners, finance and the accountant build it; viewers can download it.</desc>
<style>
.serif{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400}
.sans{font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#5F6963" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F4A3C"/><stop offset="1" stop-color="#163A2F"/></linearGradient>
</defs>
<!-- Its own light card, so the drawing reads the same on GitHub's light and dark themes. -->
<rect x="0.5" y="0.5" width="999" height="459" rx="16" fill="#F7F8F5" stroke="#E7EAE5"/>
<!-- Left: what the pack is -->
<rect x="32" y="32" width="268" height="396" rx="14" fill="url(#panel)"/>
<g transform="translate(58 58) scale(1.5)" fill="none" stroke="#D6B172" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="8"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="10" y1="11" x2="14" y2="11"/><rect x="10" y="13" width="4" height="4" rx="1"/></g>
<text x="58" y="144" class="serif" font-size="30" fill="#EEF4F0">Year-end</text>
<text x="58" y="178" class="serif" font-size="30" fill="#EEF4F0">tax pack</text>
<text x="58" y="208" class="sans" font-size="14" fill="#A9C2B6">One zip for the accountant.</text>
<line x1="58" y1="228" x2="274" y2="228" stroke="#336352"/>
<text x="58" y="256" class="sans" font-size="11" font-weight="700" letter-spacing="1.3" fill="#D6B172">BEFORE IT BUILDS</text>
<text x="58" y="278" class="sans" font-size="13.5" fill="#A9C2B6">The page lists what the</text>
<text x="58" y="297.5" class="sans" font-size="13.5" fill="#A9C2B6">accountant will ask about,</text>
<text x="58" y="317" class="sans" font-size="13.5" fill="#A9C2B6">each with a link to fix it.</text>
<text x="58" y="349" class="sans" font-size="11" font-weight="700" letter-spacing="1.3" fill="#D6B172">WHO CAN USE IT</text>
<text x="58" y="371" class="sans" font-size="13.5" fill="#A9C2B6">Owners, finance and the</text>
<text x="58" y="390.5" class="sans" font-size="13.5" fill="#A9C2B6">accountant build it.</text>
<text x="58" y="410" class="sans" font-size="13.5" fill="#A9C2B6">Viewers can download it.</text>
<!-- Right: what is inside -->
<rect x="324" y="32" width="644" height="396" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<rect x="344" y="44.3" width="32" height="32" rx="8" fill="#DCE9DF"/>
<g transform="translate(350.5 50.8) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="392" y="57.3" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Export proceeds by month</text>
<text x="392" y="76.3" class="sans" font-size="13" fill="#5F6963">In the currency received and in PKR</text>
<line x1="344" y1="88.6" x2="948" y2="88.6" stroke="#E7EAE5"/>
<rect x="344" y="100.9" width="32" height="32" rx="8" fill="#DCE9DF"/>
<g transform="translate(350.5 107.4) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="392" y="113.9" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Every credit, with its paperwork status</text>
<text x="392" y="132.9" class="sans" font-size="13" fill="#5F6963">ePRC and withholding certificate status and number, plus copies on file</text>
<line x1="344" y1="145.1" x2="948" y2="145.1" stroke="#E7EAE5"/>
<rect x="344" y="157.4" width="32" height="32" rx="8" fill="#DCE9DF"/>
<g transform="translate(350.5 163.9) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="392" y="170.4" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Banking-channel share working</text>
<text x="392" y="189.4" class="sans" font-size="13" fill="#5F6963">The working behind the share of income that came through banks</text>
<line x1="344" y1="201.7" x2="948" y2="201.7" stroke="#E7EAE5"/>
<rect x="344" y="214" width="32" height="32" rx="8" fill="#DCE9DF"/>
<g transform="translate(350.5 220.5) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="392" y="227" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Invoices issued in the year</text>
<text x="392" y="246" class="sans" font-size="13" fill="#5F6963">With what came in and what was credited</text>
<line x1="344" y1="258.3" x2="948" y2="258.3" stroke="#E7EAE5"/>
<rect x="344" y="270.6" width="32" height="32" rx="8" fill="#DCE9DF"/>
<g transform="translate(350.5 277.1) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="392" y="283.6" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Credit notes, write-offs and voids</text>
<text x="392" y="302.6" class="sans" font-size="13" fill="#5F6963">With their reasons</text>
<line x1="344" y1="314.9" x2="948" y2="314.9" stroke="#E7EAE5"/>
<rect x="344" y="327.1" width="32" height="32" rx="8" fill="#DCE9DF"/>
<g transform="translate(350.5 333.6) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="392" y="340.1" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Flags still open</text>
<text x="392" y="359.1" class="sans" font-size="13" fill="#5F6963">Listed as exceptions</text>
<line x1="344" y1="371.4" x2="948" y2="371.4" stroke="#E7EAE5"/>
<rect x="344" y="383.7" width="32" height="32" rx="8" fill="#DCE9DF"/>
<g transform="translate(350.5 390.2) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><polyline points="14,3 14,7 18,7"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></g>
<text x="392" y="396.7" class="sans" font-size="15.5" font-weight="700" fill="#29332F">A README for the accountant</text>
<text x="392" y="415.7" class="sans" font-size="13" fill="#5F6963">The year in numbers, PSEB status (does it lapse this year?), what’s missing</text>
</svg>
