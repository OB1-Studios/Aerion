<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" width="1000" height="312" role="img" aria-labelledby="t d"><title id="t">Reading benchmark</title><desc id="d">Layout rules with no model read 100% of fields correctly in the demo layout but only 12% in other layouts, and get 19 of 61 documents fully right.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="311" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><text x="36" y="40" class="sans" font-size="15" font-weight="700" fill="#14233B" text-anchor="start" >Built-in layout rules, no model. Cost: $0.</text><line x1="316" y1="64" x2="316" y2="236" stroke="#D3DDD4"/><text x="316" y="256" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="middle" >0%</text><line x1="466.0" y1="64" x2="466.0" y2="236" stroke="#D3DDD4"/><text x="466.0" y="256" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="middle" >25%</text><line x1="616.0" y1="64" x2="616.0" y2="236" stroke="#D3DDD4"/><text x="616.0" y="256" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="middle" >50%</text><line x1="766.0" y1="64" x2="766.0" y2="236" stroke="#D3DDD4"/><text x="766.0" y="256" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="middle" >75%</text><line x1="916" y1="64" x2="916" y2="236" stroke="#D3DDD4"/><text x="916" y="256" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="middle" >100%</text><text x="36" y="92" class="sans" font-size="15" font-weight="700" fill="#14233B" text-anchor="start" >Fields right</text><text x="36" y="110" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >demo layout</text><rect x="316" y="76" width="600.0" height="40" rx="6" fill="#1E7F5C" stroke="#1E7F5C" stroke-width="0" /><text x="902.0" y="102" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="end" >100%</text><text x="36" y="148" class="sans" font-size="15" font-weight="700" fill="#14233B" text-anchor="start" >Fields right</text><text x="36" y="166" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >other layouts</text><rect x="316" y="132" width="72.0" height="40" rx="6" fill="#C23B32" stroke="#C23B32" stroke-width="0" /><text x="400.0" y="158" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >12%</text><text x="36" y="204" class="sans" font-size="15" font-weight="700" fill="#14233B" text-anchor="start" >Documents fully right</text><text x="36" y="222" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >of 61 documents</text><rect x="316" y="188" width="186.88524590163937" height="40" rx="6" fill="#9A6212" stroke="#9A6212" stroke-width="0" /><text x="514.8852459016393" y="214" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >19 of 61</text><text x="36" y="292" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >61 SIMULATED documents: 16 in the demo bank's layout, 45 in layouts the rules were never written for.</text></svg>