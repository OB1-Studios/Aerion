<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-labelledby="t d"><title id="t">Reading benchmark</title><desc id="d">61 simulated documents with known answers, 45 of them in layouts the built-in rules were never written for. Fields right in those layouts: minimax-m3.1-flash 100% (the model in use), glm-5.3-flash 99.0%, deepseek-v4.1-flash-1017 98.6%, layout rules with no model 12%. Documents fully right, of 61: 61, 55, 54 and 19.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999.0" height="403.0" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1"/><text x="36.0" y="42.0" class="sans" font-size="16" font-weight="700" fill="#14233B">Reading 61 SIMULATED documents with known answers</text><text x="36.0" y="64.0" class="sans" font-size="13" fill="#4B5B73">45 of them are in layouts the built-in rules were never written for. Measured 2026-11-07 with the deployed settings.</text><rect x="20.0" y="84.0" width="960.0" height="270.0" rx="14" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1"/><text x="360.0" y="116.0" class="sans" font-size="13" font-weight="700" fill="#14233B">Fields right, other layouts</text><text x="660.0" y="116.0" class="sans" font-size="13" font-weight="700" fill="#14233B">Documents fully right, of 61</text><line x1="360.0" y1="130.0" x2="360.0" y2="312.0" stroke="#CBD5E1" stroke-width="1"/><text x="360.0" y="330.0" class="sans" font-size="11" fill="#64748B" text-anchor="middle">0%</text><line x1="475.0" y1="130.0" x2="475.0" y2="312.0" stroke="#E2E8F0" stroke-width="1"/><text x="475.0" y="330.0" class="sans" font-size="11" fill="#64748B" text-anchor="middle">50%</text><line x1="590.0" y1="130.0" x2="590.0" y2="312.0" stroke="#E2E8F0" stroke-width="1"/><text x="590.0" y="330.0" class="sans" font-size="11" fill="#64748B" text-anchor="middle">100%</text><line x1="660.0" y1="130.0" x2="660.0" y2="312.0" stroke="#CBD5E1" stroke-width="1"/><text x="660.0" y="330.0" class="sans" font-size="11" fill="#64748B" text-anchor="middle">0</text><line x1="735.4" y1="130.0" x2="735.4" y2="312.0" stroke="#E2E8F0" stroke-width="1"/><text x="735.4" y="330.0" class="sans" font-size="11" fill="#64748B" text-anchor="middle">20</text><line x1="810.8" y1="130.0" x2="810.8" y2="312.0" stroke="#E2E8F0" stroke-width="1"/><text x="810.8" y="330.0" class="sans" font-size="11" fill="#64748B" text-anchor="middle">40</text><line x1="886.2" y1="130.0" x2="886.2" y2="312.0" stroke="#E2E8F0" stroke-width="1"/><text x="886.2" y="330.0" class="sans" font-size="11" fill="#64748B" text-anchor="middle">60</text><text x="36.0" y="145.0" class="sans" font-size="13.5" font-weight="700" fill="#14233B">minimax-m3.1-flash</text><text x="36.0" y="162.0" class="sans" font-size="11.5" fill="#64748B">in use · $0.12 for all 61 · 4.0 s a document</text><path d="M360.0 136.0h226.0a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-226.0z" fill="#2a78d6"/><text x="598.0" y="149.5" class="sans" font-size="13" font-weight="700" fill="#14233B">100%</text><path d="M660.0 136.0h226.0a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-226.0z" fill="#2a78d6"/><text x="898.0" y="149.5" class="sans" font-size="13" font-weight="700" fill="#14233B">61 of 61</text><text x="36.0" y="191.0" class="sans" font-size="13.5" font-weight="500" fill="#14233B">glm-5.3-flash</text><text x="36.0" y="208.0" class="sans" font-size="11.5" fill="#64748B">$0.05 · 5.4 s a document</text><path d="M360.0 182.0h223.7a4 4 0 0 1 4 4v