<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-labelledby="t d"><title id="t">Deploy on Vultr in six steps</title><desc id="d">Settings, plan, apply, Coolify, deploy, check. The apply step creates the whole stack and costs money.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="443" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><line x1="60" y1="60" x2="60" y2="380" stroke="#C6D3C8" stroke-width="2"/><circle cx="60" cy="60" r="16" fill="#14233B"/><text x="60" y="66" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="100" y="58" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Settings</text><text x="100" y="79" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Add VULTR_API_KEY and ADMIN_CIDR to .env.</text><rect x="636" y="42" width="328" height="36" rx="8" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="650" y="65" class="mono" font-size="12" font-weight="400" fill="#E3EAF5" text-anchor="start" >VULTR_API_KEY, ADMIN_CIDR</text><circle cx="60" cy="124" r="16" fill="#14233B"/><text x="60" y="130" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="100" y="122" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Plan</text><text x="100" y="143" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Read-only. Shows what exists, what would be created, cost and credit.</text><rect x="636" y="106" width="328" height="36" rx="8" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="650" y="129" class="mono" font-size="12" font-weight="400" fill="#E3EAF5" text-anchor="start" >pnpm infra:plan</text><circle cx="60" cy="188" r="16" fill="#14233B"/><text x="60" y="194" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="100" y="186" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Apply</text><rect x="178" y="168" width="99" height="22" rx="11.0" fill="#F8DAD6" stroke="#F8DAD6" stroke-width="0" /><text x="227.5" y="183.2" class="sans" font-size="12" font-weight="600" fill="#8E241C" text-anchor="middle" >Costs money</text><text x="100" y="207" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Creates the whole stack: VM, database, storage, inference.</text><rect x="636" y="170" width="328" height="36" rx="8" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="650" y="193" class="mono" font-size="12" font-weight="400" fill="#E3EAF5" text-anchor="start" >pnpm infra:apply -- --yes</text><circle cx="60" cy="252" r="16" fill="#14233B"/><text x="60" y="258" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="100" y="250" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Coolify</text><text x="100" y="271" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Open it from your IP, add the repo as a Docker Compose resource.</text><rect x="636" y="234" width="328" height="36" rx="8" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="650" y="257" class="mono" font-size="12" font-weight="400" fill="#E3EAF5" text-anchor="start" >http://&lt;vm-ip&gt;:8000</text><circle cx="60" cy="316" r="16" fill="#14233B"/><text x="60" y="322" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="100" y="314" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Deploy</text><text x="100" y="335" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Migrations run first; web and worker start only if they succeed.</text><rect x="636" y="298" width="328" height="36" rx="8" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="650" y="321" class="mono" font-size="12" font-weight="400" fill="#E3EAF5" text-anchor="start" >pnpm --filter @ebo/worker cli reset-demo</text><circle cx="60" cy="380" r="16" fill="#14233B"/><text x="60" y="386" class="sans" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >6</text><text x="100" y="378" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Check</text><text x="100" y="399" class="sans" font-size="13.5" font-weight="400" fill="#4B5B73" text-anchor="start" >Credit left, health, backups, model usage and pending charges.</text><rect x="636" y="362" width="328" height="36" rx="8" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="650" y="385" class="mono" font-size="12" font-weight="400" fill="#E3EAF5" text-anchor="start" >pnpm infra:status</text></svg>