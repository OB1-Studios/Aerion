<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">Aerion</title>
<desc id="desc">Banner: “The finance back office for Pakistan’s software houses and IT freelancers”, with three promises: never moves money, every number checked, runs on Vultr. On a dark green panel, a ledger slip for Monday, 09:00 Pakistan time shows a credit advice read (by the model), matched to an invoice and an ePRC item opened (by code), stamped MATCHED in gold.</desc>
<style>
.serif{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400}
.sans{font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#5F6963" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F4A3C"/><stop offset="1" stop-color="#163A2F"/></linearGradient>
</defs>
<!-- Its own light card, so the drawing reads the same on GitHub's light and dark themes. -->
<rect x="0.5" y="0.5" width="999" height="359" rx="16" fill="#F7F8F5" stroke="#E7EAE5"/>
<!-- Right: the dark sidebar green, following the card's rounded corners -->
<path d="M612 0.5H983.5A16 16 0 0 1 999.5 16.5V343.5A16 16 0 0 1 983.5 359.5H612Z" fill="url(#panel)"/>
<!-- Left: the pitch, with the app's terracotta rule -->
<rect x="60" y="74" width="2.5" height="142" fill="#C77959"/>
<text x="84" y="106" class="serif" font-size="36" fill="#29332F">The finance back office</text>
<text x="84" y="152" class="serif" font-size="36" fill="#29332F">for Pakistan’s software</text>
<text x="84" y="198" class="serif" font-size="36" fill="#29332F">houses and IT freelancers.</text>
<rect x="84" y="238" width="172.2" height="34" rx="17" fill="#FFFFFF" stroke="#D3D9D2"/>
<circle cx="101" cy="255" r="3.5" fill="#C9A15F"/>
<text x="110" y="259.7" class="sans" font-size="13" font-weight="700" fill="#214F41">Never moves money</text>
<rect x="264.2" y="238" width="187.5" height="34" rx="17" fill="#FFFFFF" stroke="#D3D9D2"/>
<circle cx="281.2" cy="255" r="3.5" fill="#C9A15F"/>
<text x="290.2" y="259.7" class="sans" font-size="13" font-weight="700" fill="#214F41">Every number checked</text>
<rect x="459.7" y="238" width="127.4" height="34" rx="17" fill="#FFFFFF" stroke="#D3D9D2"/>
<circle cx="476.7" cy="255" r="3.5" fill="#C9A15F"/>
<text x="485.7" y="259.7" class="sans" font-size="13" font-weight="700" fill="#214F41">Runs on Vultr</text>
<!-- The ledger slip -->
<rect x="648" y="56" width="316" height="236" rx="12" fill="#FFFFFF"/>
<text x="672" y="92" class="sans" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5F6963">MONDAY, 09:00 PAKISTAN TIME</text>
<line x1="672" y1="110" x2="940" y2="110" stroke="#E7EAE5"/>
<circle cx="686" cy="148" r="13" fill="#E7EFF8"/>
<g transform="translate(678 140) scale(0.7)" fill="none" stroke="#356A9A" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5.5,12.5 10,17 18.5,7.5"/></g>
<text x="710" y="153.5" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Credit advice read</text>
<rect x="882.9" y="136" width="57.1" height="24" rx="12" fill="#E7EFF8"/>
<text x="911.4" y="152.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#356A9A">Model</text>
<line x1="672" y1="173" x2="940" y2="173" stroke="#E7EAE5" stroke-dasharray="3 4"/>
<circle cx="686" cy="198" r="13" fill="#DCE9DF"/>
<g transform="translate(678 190) scale(0.7)" fill="none" stroke="#214F41" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5.5,12.5 10,17 18.5,7.5"/></g>
<text x="710" y="203.5" class="sans" font-size="15.5" font-weight="700" fill="#29332F">Matched to invoice</text>
<rect x="889.1" y="186" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="914.5" y="202.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<line x1="672" y1="223" x2="940" y2="223" stroke="#E7EAE5" stroke-dasharray="3 4"/>
<circle cx="686" cy="248" r="13" fill="#DCE9DF"/>
<g transform="translate(678 240) scale(0.7)" fill="none" stroke="#214F41" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5.5,12.5 10,17 18.5,7.5"/></g>
<text x="710" y="253.5" class="sans" font-size="15.5" font-weight="700" fill="#29332F">ePRC item opened</text>
<rect x="889.1" y="236" width="50.9" height="24" rx="12" fill="#DCE9DF"/>
<text x="914.5" y="252.3" class="sans" font-size="12" font-weight="700" text-anchor="middle" fill="#214F41">Code</text>
<!-- The stamp, in gold -->
<g transform="rotate(-7 884 300)">
<rect x="796" y="276" width="176" height="48" rx="8" fill="#163A2F" stroke="#D6B172" stroke-width="2"/>
<rect x="802" y="282" width="164" height="36" rx="5" fill="none" stroke="#D6B172" stroke-width="0.9"/>
<text x="884" y="308.5" class="serif" font-size="24" letter-spacing="2.5" text-anchor="middle" fill="#D6B172">MATCHED</text>
</g>
</svg>
