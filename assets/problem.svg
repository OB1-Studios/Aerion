<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-labelledby="t d"><title id="t">The problem</title><desc id="d">Money arrives by SWIFT wire, Payoneer or Wise. Each payment comes with paperwork: purpose code, ePRC, withholding certificates, PSEB registration and banking-channel share. That paperwork decides how the income is taxed, and today someone checks it by hand every week.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="391" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><text x="36" y="40" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Money arrives by</text><text x="326" y="40" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >Each payment comes with</text><text x="714" y="40" class="serif" font-size="20" font-weight="700" fill="#14233B" text-anchor="start" >which decides</text><rect x="36" y="60" width="250" height="56" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="54" y="85" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >SWIFT wire</text><text x="54" y="104" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >into a Pakistani bank</text><rect x="36" y="128" width="250" height="56" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="54" y="153" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Payoneer</text><text x="54" y="172" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >wallet payout</text><rect x="36" y="196" width="250" height="56" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="54" y="221" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Wise</text><text x="54" y="240" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >into a PKR account</text><text x="36" y="292" class="sans" font-size="13" font-weight="700" fill="#4B5B73" text-anchor="start" >These don't pay out to Pakistan</text><rect x="36" y="304" width="84" height="30" rx="15" fill="#ECEFEA" stroke="#D3DDD4" stroke-width="1" /><text x="78.0" y="324" class="sans" font-size="14" font-weight="600" fill="#7B879B" text-anchor="middle" >PayPal</text><line x1="50" y1="319" x2="106" y2="319" stroke="#7B879B" stroke-width="1.5"/><rect x="130" y="304" width="84" height="30" rx="15" fill="#ECEFEA" stroke="#D3DDD4" stroke-width="1" /><text x="172.0" y="324" class="sans" font-size="14" font-weight="600" fill="#7B879B" text-anchor="middle" >Stripe</text><line x1="144" y1="319" x2="200" y2="319" stroke="#7B879B" stroke-width="1.5"/><rect x="326" y="60" width="350" height="296" rx="12" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><rect x="346" y="82" width="18" height="18" rx="4" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><text x="376" y="96" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Purpose code</text><text x="376" y="116" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="start" >on the remittance</text><line x1="346" y1="125" x2="656" y2="125" stroke="#D3DDD4"/><rect x="346" y="137" width="18" height="18" rx="4" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><text x="376" y="151" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >ePRC</text><text x="376" y="171" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="start" >electronic Proceeds Realization Certificate</text><line x1="346" y1="180" x2="656" y2="180" stroke="#D3DDD4"/><rect x="346" y="192" width="18" height="18" rx="4" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><text x="376" y="212" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Withholding certificates</text><line x1="346" y1="235" x2="656" y2="235" stroke="#D3DDD4"/><rect x="346" y="247" width="18" height="18" rx="4" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><text x="376" y="267" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >PSEB registration</text><line x1="346" y1="290" x2="656" y2="290" stroke="#D3DDD4"/><rect x="346" y="302" width="18" height="18" rx="4" fill="#fff" stroke="#5B6B84" stroke-width="1.5" /><text x="376" y="316" class="sans" font-size="16" font-weight="700" fill="#14233B" text-anchor="start" >Banking-channel share</text><text x="376" y="336" class="sans" font-size="12" font-weight="400" fill="#4B5B73" text-anchor="start" >of income that came through banks</text><rect x="714" y="60" width="250" height="296" rx="12" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="736" y="104" class="serif" font-size="23" font-weight="700" fill="#F3F6FA" text-anchor="start" >How the income</text><text x="736" y="134" class="serif" font-size="23" font-weight="700" fill="#F3F6FA" text-anchor="start" >is taxed</text><line x1="736" y1="150" x2="942" y2="150" stroke="#38507A"/><text x="736" y="182" class="sans" font-size="14" font-weight="400" fill="#C9D4E6" text-anchor="start" >Today, someone checks all</text><text x="736" y="203" class="sans" font-size="14" font-weight="400" fill="#C9D4E6" text-anchor="start" >of it by hand, every week,</text><text x="736" y="224" class="sans" font-size="14" font-weight="400" fill="#C9D4E6" text-anchor="start" >across:</text><rect x="736" y="238" width="150" height="30" rx="15" fill="#1F3250" stroke="#38507A" stroke-width="1" /><text x="811" y="258" class="sans" font-size="13.5" font-weight="600" fill="#E3EAF5" text-anchor="middle" >bank emails</text><rect x="736" y="276" width="150" height="30" rx="15" fill="#1F3250" stroke="#38507A" stroke-width="1" /><text x="811" y="296" class="sans" font-size="13.5" font-weight="600" fill="#E3EAF5" text-anchor="middle" >wallet exports</text><rect x="736" y="314" width="150" height="30" rx="15" fill="#1F3250" stroke="#38507A" stroke-width="1" /><text x="811" y="334" class="sans" font-size="13.5" font-weight="600" fill="#E3EAF5" text-anchor="middle" >client threads</text><path d="M286,88 H298 V224 H286 M298,156 H304" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,156 H320" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M682,208 H706" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/></svg>