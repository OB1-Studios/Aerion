<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">Who approves what goes out</title>
<desc id="desc">Every drafted email has its numbers checked against the records. In supervised mode, the default, a person approves every email, the numbers are checked again, and then it is sent. In autopilot mode, with an optional amount cap, routine emails go out on their own, sensitive ones wait 30 minutes so anyone can cancel, and some always need a person.</desc>
<style>
.serif{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400}
.sans{font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#5F6963" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F4A3C"/><stop offset="1" stop-color="#163A2F"/></linearGradient>
</defs>
<!-- Its own light card, so the drawing reads the same on GitHub's light and dark themes. -->
<rect x="0.5" y="0.5" width="999" height="403" rx="16" fill="#F7F8F5" stroke="#E7EAE5"/>
<!-- Every email starts as a checked draft -->
<rect x="32" y="150" width="176" height="104" rx="12" fill="url(#panel)"/>
<text x="120" y="188" class="serif" font-size="19" text-anchor="middle" fill="#EEF4F0">Email drafted</text>
<text x="120" y="212" class="sans" font-size="12.5" text-anchor="middle" fill="#A9C2B6">numbers checked</text>
<text x="120" y="229" class="sans" font-size="12.5" text-anchor="middle" fill="#A9C2B6">against the records</text>
<path d="M208 202H234M234 86V274" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M234 86H255" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M234 274H255" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<!-- Supervised -->
<rect x="262" y="28" width="706" height="116" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="284" y="61" class="serif" font-size="20" fill="#29332F">Supervised mode</text>
<text x="462.6" y="61" class="sans" font-size="13" fill="#5F6963">the default</text>
<rect x="284" y="78" width="238.3" height="46" rx="10" fill="#FBF0DE" stroke="#EDD3A6"/>
<text x="403.1" y="105.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#A86412">A person approves every email</text>
<path d="M528.3 101H552.3" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="558.3" y="78" width="194.6" height="46" rx="10" fill="#DCE9DF"/>
<text x="655.6" y="105.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#214F41">Numbers checked again</text>
<path d="M758.9 101H782.9" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="788.9" y="78" width="157.1" height="46" rx="10" fill="#FFFFFF" stroke="#D3D9D2"/>
<g transform="translate(830.4 92) scale(0.8)" fill="none" stroke="#214F41" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="5.5,12.5 10,17 18.5,7.5"/></g>
<text x="853.4" y="105.5" class="sans" font-size="13.5" font-weight="700" fill="#29332F">Sent</text>
<!-- Autopilot -->
<rect x="262" y="168" width="706" height="212" rx="14" fill="#FFFFFF" stroke="#E7EAE5"/>
<text x="284" y="201" class="serif" font-size="20" fill="#29332F">Autopilot mode</text>
<text x="445.1" y="201" class="sans" font-size="13" fill="#5F6963">with an optional amount cap</text>
<rect x="284" y="216" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D3D9D2"/>
<text x="374" y="241.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#29332F">Routine emails</text>
<path d="M470 237H495" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="502" y="216" width="444" height="42" rx="10" fill="#DCE9DF"/>
<text x="724" y="241.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#214F41">Go out on their own</text>
<rect x="284" y="268" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D3D9D2"/>
<text x="374" y="293.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#29332F">Sensitive emails</text>
<path d="M470 289H495" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="502" y="268" width="444" height="42" rx="10" fill="#FBF0DE" stroke="#EDD3A6"/>
<text x="724" y="293.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#A86412">Wait 30 minutes so anyone can cancel</text>
<rect x="284" y="320" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D3D9D2"/>
<text x="374" y="345.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#29332F">Some emails</text>
<path d="M470 341H495" fill="none" stroke="#5F6963" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="502" y="320" width="444" height="42" rx="10" fill="#FBF0DE" stroke="#EDD3A6"/>
<text x="724" y="345.5" class="sans" font-size="13.5" font-weight="700" text-anchor="middle" fill="#A86412">Always need a person</text>
</svg>
