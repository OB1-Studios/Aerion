<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-labelledby="t d"><title id="t">Who approves what goes out</title><desc id="d">Every drafted email has its numbers checked. In supervised mode a person approves every email and numbers are checked again at send time. In autopilot mode routine emails go out on their own, sensitive ones wait 30 minutes so anyone can cancel, and some always need a person, with an optional amount cap.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif}.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="999" height="403" rx="18" fill="#F5F7F4" stroke="#C6D3C8" stroke-width="1" /><rect x="36" y="158" width="170" height="88" rx="12" fill="#14233B" stroke="#14233B" stroke-width="0" /><text x="121" y="192" class="serif" font-size="17" font-weight="700" fill="#F3F6FA" text-anchor="middle" >Email drafted</text><text x="121" y="214" class="sans" font-size="12" font-weight="400" fill="#C9D4E6" text-anchor="middle" >numbers checked</text><text x="121" y="230" class="sans" font-size="12" font-weight="400" fill="#C9D4E6" text-anchor="middle" >against the records</text><path d="M206,202 H234 M234,86 V274" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round"/><path d="M234,86 H258" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M234,274 H258" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="262" y="28" width="702" height="116" rx="14" fill="#fff" stroke="#D3DDD4" stroke-width="1" /><text x="284" y="58" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >Supervised mode</text><text x="484" y="58" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >the default</text><rect x="284" y="78" width="230" height="46" rx="10" fill="#FAE9C9" stroke="#FAE9C9" stroke-width="1" /><text x="399.0" y="105.725" class="sans" font-size="13.5" font-weight="600" fill="#7A4E0B" text-anchor="middle" >A person approves every email</text><path d="M518,101 H548" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="552" y="78" width="190" height="46" rx="10" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="1" /><text x="647.0" y="105.725" class="sans" font-size="13.5" font-weight="600" fill="#14583F" text-anchor="middle" >Numbers checked again</text><path d="M746,101 H776" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="780" y="78" width="164" height="46" rx="10" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="862.0" y="105.725" class="sans" font-size="13.5" font-weight="600" fill="#14233B" text-anchor="middle" >Sent</text><rect x="262" y="168" width="702" height="212" rx="14" fill="#fff" stroke="#D3DDD4" stroke-width="1" /><text x="284" y="198" class="serif" font-size="18" font-weight="700" fill="#14233B" text-anchor="start" >Autopilot mode</text><text x="484" y="198" class="sans" font-size="13" font-weight="400" fill="#4B5B73" text-anchor="start" >with an optional amount cap</text><rect x="284" y="216" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="374.0" y="241.725" class="sans" font-size="13.5" font-weight="600" fill="#14233B" text-anchor="middle" >Routine emails</text><path d="M468,237 H498" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="502" y="216" width="442" height="42" rx="10" fill="#DCEFE6" stroke="#DCEFE6" stroke-width="1" /><text x="723.0" y="241.725" class="sans" font-size="13.5" font-weight="600" fill="#14583F" text-anchor="middle" >Go out on their own</text><rect x="284" y="268" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="374.0" y="293.725" class="sans" font-size="13.5" font-weight="600" fill="#14233B" text-anchor="middle" >Sensitive emails</text><path d="M468,289 H498" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="502" y="268" width="442" height="42" rx="10" fill="#FAE9C9" stroke="#FAE9C9" stroke-width="1" /><text x="723.0" y="293.725" class="sans" font-size="13.5" font-weight="600" fill="#7A4E0B" text-anchor="middle" >Wait 30 minutes so anyone can cancel</text><rect x="284" y="320" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D3DDD4" stroke-width="1" /><text x="374.0" y="345.725" class="sans" font-size="13.5" font-weight="600" fill="#14233B" text-anchor="middle" >Some emails</text><path d="M468,341 H498" fill="none" stroke="#5B6B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="502" y="320" width="442" height="42" rx="10" fill="#FAE9C9" stroke="#FAE9C9" stroke-width="1" /><text x="723.0" y="345.725" class="sans" font-size="13.5" font-weight="600" fill="#7A4E0B" text-anchor="middle" >Always need a person</text></svg>