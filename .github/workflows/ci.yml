name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ebo
          POSTGRES_PASSWORD: ebo
          POSTGRES_DB: ebo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ebo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ebo:ebo@localhost:5432/ebo?sslmode=disable
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-0123456789abcdef
